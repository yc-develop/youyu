function visualGroupItems(items, max) {
  const list = (items || []).slice().sort((a, b) => (b.value || 0) - (a.value || 0));
  const limit = max || 8;
  if (list.length <= limit) return list.map(x => ({ name: x.name, value: x.value, color: x.color }));
  const head = list.slice(0, limit - 1).map(x => ({ name: x.name, value: x.value, color: x.color }));
  const rest = list.slice(limit - 1);
  head.push({ name: '其他 ' + rest.length + ' 项', value: sum(rest, x => x.value), color: '#6b7280' });
  return head;
}

function statsGroupRows(gb, retMap, scheme) {
  const auto = !!(scheme && scheme.builtin);
  const rows = auto ? gb.items.filter(x => x.value > 0.5) : gb.items;
  return rows.map(it => {
    const ret = retMap.get(it.id);
    return '<button class="stats-row" data-action="open-group-detail" data-id="' + esc(it.id) + '">' +
      '<span class="dot" style="background:' + it.color + '"></span>' +
      '<span class="main"><span class="t">' + esc(it.name) + (!auto && it.status === 'high' ? ' <span style="font-size:8px;color:var(--gain)">超配</span>' : !auto && it.status === 'low' ? ' <span style="font-size:8px;color:var(--blue)">低配</span>' : '') + '</span>' +
        '<span class="s">' + fmtMoney(it.value, { compact: true }) + (auto ? ' · 自动分组' : ' · 目标 ' + (it.id === '__ungrouped' ? '—' : it.normalizedTarget.toFixed(1) + '%')) + '</span></span>' +
      '<span class="val"><b>' + (gb.total > 0 ? (it.pct * 100).toFixed(1) + '%' : '—') + '</b>' +
        '<span class="' + (ret ? pnlClass(ret.returnPct) : 'faint') + '">' + (ret ? fmtPct(ret.returnPct, 1) : '—') + ' · 近一年</span></span>' +
      '<span class="chev">' + icon('chevronRight') + '</span></button>';
  }).join('') || '<div class="tiny" style="padding:20px;text-align:center">暂无分组数据</div>';
}

function portfolioTrendCard(p, opts) {
  const o = opts || {};
  const days = Number(ui.trendPeriod == null ? 365 : ui.trendPeriod);
  const metric = o.metric || ui.trendMetric || 'amount';
  const daily = buildDailyAnalytics();
  const series = o.series || daily.total;
  const tw = twrStats(series, days || daily.n - 1);
  const pnl = sum(series.pnls.slice(Math.max(1, daily.n - 1 - (days || daily.n - 1))));
  const title = o.title || '组合走势';
  const scope = o.scopeName || '全部资产';
  const labels = { 30: '1月', 90: '3月', 365: '1年', 0: '全部' };
  const lookback = days || daily.n - 1;
  const start = Math.max(1, daily.n - 1 - lookback);
  let points = [];
  if (metric === 'amount') {
    let cumulative = 0;
    points.push({ date: daily.dates[Math.max(0, start - 1)], value: 0 });
    for (let i = start; i < daily.n; i++) {
      cumulative += series.pnls[i] || 0;
      points.push({ date: daily.dates[i], value: cumulative });
    }
  } else {
    points = tw.points.map(x => ({ date: x.date, value: x.value }));
  }
  let chart = '';
  if (points.length > 1) {
    chart = lineChartHTML({
      points,
      mode: metric === 'amount' ? 'amount' : 'percent',
      currency: baseCurrency(),
      color: (metric === 'amount' ? pnl : tw.totalReturn) >= 0 ? '#ff5d6c' : '#35d39a',
      height: 156, baseline: true,
      aria: scope + (metric === 'amount' ? '收益金额走势' : '收益率走势')
    });
  } else chart = chartEmptyHTML('还没有足够的历史数据', 156);
  const pill = metric === 'amount' ? pnlText(pnl, { compact: true }) : fmtPct(tw.totalReturn, 2);
  const sub = metric === 'amount' ? '累计收益金额' : '时间加权收益率';
  return '<section class="detail-chart-card" style="margin:14px 0 0;border-radius:20px">' +
    '<div class="chart-head"><div><h2>' + esc(title) + '</h2><div class="sub">' + sub + ' · ' + esc(scope) + ' · ' + (state.settings.considerFx ? '含汇率影响' : '不含汇率影响') + '</div></div>' +
      '<span class="pill-btn" style="height:26px;font-size:9px;padding:0 9px">' + icon('trendUp') + pill + '</span></div>' +
    chart +
    '<div class="trend-metric-row"><div class="segmented small" style="width:112px"><button class="seg ' + (metric === 'amount' ? 'active' : '') + '" data-action="set-trend-metric" data-value="amount">金额</button><button class="seg ' + (metric === 'percent' ? 'active' : '') + '" data-action="set-trend-metric" data-value="percent">收益率</button></div>' +
      '<span class="tiny">更新至 ' + shortDate(todayKey()) + '</span></div>' +
    '<div class="metrics">' +
      '<div class="metric"><div class="lab">区间收益</div><div class="val ' + pnlClass(pnl) + '">' + pnlText(pnl, { compact: true }) + '</div><div class="sub">金额</div></div>' +
      '<div class="metric"><div class="lab">最大回撤</div><div class="val loss">' + fmtPct(tw.maxDrawdown, 2) + '</div><div class="sub">回撤</div></div>' +
      '<div class="metric"><div class="lab">年化收益</div><div class="val ' + pnlClass(tw.annualized) + '">' + fmtPct(tw.annualized, 2) + '</div><div class="sub">参考</div></div>' +
      '<div class="metric"><div class="lab">正收益天</div><div class="val">' + (tw.positiveRate * 100).toFixed(0) + '%</div><div class="sub">胜率</div></div>' +
    '</div>' +
    '<div class="period-row"><div class="segmented small">' + [30, 90, 365, 0].map(d => '<button class="seg ' + (days === d ? 'active' : '') + '" data-action="set-trend-period" data-value="' + d + '">' + labels[d] + '</button>').join('') + '</div>' +
      '<span class="tiny">' + (metric === 'amount' ? '累计盈亏' : '时间加权') + '</span></div>' +
  '</section>';
}

      '<div class="bar-track"><div class="bar-fill" style="width:' + (pct * 100).toFixed(1) + '%;background:' + (c.instrument ? c.instrument.color : (c.account.color || '#8e9aaf')) + '"></div></div>' +

    '<div class="right">近一年<b class="' + (ret ? pnlClass(ret.returnPct) : '') + '">' + (ret ? fmtPct(ret.returnPct, 2) : '—') + '</b><span>收益率</span></div></div>' +

}


/* =========================================================
   08 · 收益日历（日 / 周 / 月 / 年）
   ========================================================= */
function calendarSchemeId() {
  if (!ui.calendarSchemeId || !schemes().some(s => s.id === ui.calendarSchemeId)) ui.calendarSchemeId = '__auto_account';
  return ui.calendarSchemeId;
}
function calendarGroupId(schemeId) {
  const sid = schemeId || calendarSchemeId();
  if (!ui.calendarGroupId) ui.calendarGroupId = 'all';
  if (ui.calendarGroupId === 'all' || ui.calendarGroupId === '__ungrouped') return ui.calendarGroupId;
  return groupById(sid, ui.calendarGroupId) ? ui.calendarGroupId : 'all';
}
function calendarSeries(schemeId, groupId) {
  const daily = buildDailyAnalytics();
  if (!groupId || groupId === 'all') return { name: '全部资产', color: '#ff9f45', values: daily.total.values, pnls: daily.total.pnls, dates: daily.dates };
  const gs = groupDailySeries(schemeId);
  const g = gs.groups.find(x => x.id === groupId);
  if (!g) return { name: '全部资产', color: '#ff9f45', values: daily.total.values, pnls: daily.total.pnls, dates: daily.dates };
  return { name: g.name, color: g.color, values: g.values, pnls: g.pnls, dates: daily.dates };
}
function calendarDatePnl(series, date) {
  const daily = buildDailyAnalytics();
  const idx = daily.indexMap.get(date);
  if (idx == null) return { pnl: 0, ret: 0 };
  const p = series.pnls[idx] || 0;
  const prev = idx > 0 ? series.values[idx - 1] : 0;
  return { pnl: p, ret: prev > 0 ? p / prev : 0 };
}

function renderCalendarPage() {
  const sid = calendarSchemeId();
  const scheme = schemeById(sid);
  const gid = calendarGroupId(sid);
  const daily = buildDailyAnalytics();
  const mode = ui.calendarMode || 'day';
  const metric = ui.calendarMetric || 'amount';
  const series = calendarSeries(sid, gid);
  if (!ui.calendarMonth) ui.calendarMonth = startOfMonth(todayKey());
  const month = ui.calendarMonth;
  const year = Number(ui.calendarYear) || parseDay(month).getFullYear();
  ui.calendarYear = year;
  const monthStart = startOfMonth(month);
  const monthEnd = endOfMonth(month);
  const groups = scheme ? scheme.groups : [];
  const groupChips = '<div class="chip-row" style="margin-bottom:12px"><button class="chip ' + (gid === 'all' ? 'active' : '') + '" data-action="select-calendar-group" data-id="all">全部资产</button>' +
    groups.map(g => '<button class="chip ' + (gid === g.id ? 'active' : '') + '" data-action="select-calendar-group" data-id="' + esc(g.id) + '"><span class="dot" style="background:' + g.color + '"></span>' + esc(g.name) + '</button>').join('') +
    '</div>';

  let periodStart, periodEnd, summaryLabel;
  if (mode === 'day' || mode === 'week') {
    periodStart = monthStart; periodEnd = monthEnd < todayKey() ? monthEnd : todayKey(); summaryLabel = '当月收益';
  } else if (mode === 'month') {
    periodStart = year + '-01-01'; periodEnd = year + '-12-31' < todayKey() ? year + '-12-31' : todayKey(); summaryLabel = '本年收益';
  } else {
    periodStart = daily.dates[0]; periodEnd = todayKey(); summaryLabel = '记账以来';
  }
  let summary = periodStats(series, periodStart, periodEnd);
  if (periodStart > todayKey()) summary = periodStats(series, todayKey(), todayKey());
  const totalPnl = summary.pnl;
  const summaryMain = metric === 'percent' ? fmtPct(summary.returnPct, 2) : (totalPnl > 0 ? '+' : totalPnl < 0 ? '-' : '') + fmtMoney(Math.abs(totalPnl));
  const best = summary.best || { pnl: 0, date: periodStart };

  const header = pageTop({
    eyebrow: 'GAIN CALENDAR',
    title: '收益日历',
    sub: '每天的涨跌，都是长期的一部分。',
    actions: '<button class="icon-btn" data-action="calendar-today" aria-label="回到本月">' + icon('target') + '</button>'
  });

  const controls = schemeChipsHTML(sid, 'select-calendar-scheme') + groupChips +
    '<div class="cal-toolbar"><div class="segmented">' +
      [['day', '日'], ['week', '周'], ['month', '月'], ['year', '年']].map(([k, l]) => '<button class="seg ' + (mode === k ? 'active' : '') + '" data-action="set-calendar-mode" data-value="' + k + '">' + l + '</button>').join('') +
    '</div><div class="segmented mini-toggle">' +
      [['amount', '金额'], ['percent', '收益率']].map(([k, l]) => '<button class="seg ' + (metric === k ? 'active' : '') + '" data-action="set-calendar-metric" data-value="' + k + '">' + l + '</button>').join('') +
    '</div></div>';

  const summaryHTML = '<section class="cal-summary">' +
    '<div class="l">' + summaryLabel + ' <span class="faint">· ' + esc(series.name) + '</span></div>' +
    '<div class="v ' + pnlClass(totalPnl) + '">' + summaryMain + '</div>' +
    '<div class="sub"><b class="' + pnlClass(summary.returnPct) + '">' + fmtPct(summary.returnPct, 2) + '</b><span>区间收益率</span><span class="faint">' + (summary.positiveDays || 0) + ' 天盈利 / ' + (summary.negativeDays || 0) + ' 天亏损</span></div>' +
    '<div class="cal-mini-stats"><div><div class="l">最佳单日</div><div class="n gain">' + (best.pnl >= 0 ? '+' : '') + fmtMoney(best.pnl, { compact: true }) + '</div></div>' +
      '<div><div class="l">日均收益</div><div class="n ' + pnlClass(totalPnl) + '">' + fmtMoney(summary.days ? totalPnl / summary.days : 0, { compact: true }) + '</div></div>' +
      '<div><div class="l">胜率</div><div class="n">' + ((summary.positiveDays + summary.negativeDays) > 0 ? Math.round(summary.positiveDays / (summary.positiveDays + summary.negativeDays) * 100) : 0) + '%</div></div></div>' +
  '</section>';

  let bodyHTML = '';
  if (mode === 'day') bodyHTML = dayCalendarHTML(series, month, metric);
  else if (mode === 'week') bodyHTML = weekCalendarHTML(series, month);
  else if (mode === 'month') bodyHTML = monthCalendarHTML(series, year);
  else bodyHTML = yearCalendarHTML(series) + yearInsightHTML(series, year);

  const navTitle = mode === 'day' || mode === 'week' ? monthCN(month) : mode === 'month' ? year + '年' : '年度收益';
  const currentYear = parseDay(todayKey()).getFullYear();
  const atLatest = (mode === 'day' || mode === 'week') ? startOfMonth(month) >= startOfMonth(todayKey()) : mode === 'month' ? year >= currentYear : true;
  const nav = mode === 'year' ? '' : '<div class="cal-head"><div class="title">' + navTitle + '</div><div class="nav">' +
    '<button class="icon-btn" data-action="cal-prev" aria-label="上一页">' + icon('chevronLeft') + '</button>' +
    '<button class="icon-btn" data-action="cal-next" aria-label="下一页"' + (atLatest ? ' disabled' : '') + '>' + icon('chevronRight') + '</button></div></div>';

  return header + controls + summaryHTML + nav + bodyHTML +
    '<div class="cal-legend"><span>' + (mode === 'day' || mode === 'week' ? '当月每日盈亏' : mode === 'month' ? '本年每月盈亏' : '年度收益') + '</span><div class="scale"><span class="loss">亏</span><i class="l3"></i><i class="l2"></i><i class="l1"></i><i></i><i class="g1"></i><i class="g2"></i><i class="g3"></i><span class="gain">盈</span></div></div>' +
    '<div style="height:10px"></div>' +
    portfolioTrendCard(portfolioSummary(), { series, title: gid === 'all' ? '组合走势' : series.name + '走势', scopeName: series.name }) +
    '<div style="height:10px"></div>';
}

function dayCalendarHTML(series, month, metric) {
  const daily = buildDailyAnalytics();
  const first = startOfMonth(month);
  const last = endOfMonth(month);
  const firstDay = parseDay(first).getDay();
  const total = daysInMonth(month);
  const recDates = new Set(state.records.map(r => r.date));
  let maxAbs = 1;
  for (let i = 1; i <= total; i++) {
    const d = first.slice(0, 8) + String(i).padStart(2, '0');
    const p = calendarDatePnl(series, d).pnl;
    if (Math.abs(p) > maxAbs) maxAbs = Math.abs(p);
  }
  let cells = '';
  for (let i = 0; i < firstDay; i++) cells += '<div class="cal-cell blank"></div>';
  for (let i = 1; i <= total; i++) {
    const d = first.slice(0, 8) + String(i).padStart(2, '0');
    const future = d > todayKey();
    const { pnl, ret } = calendarDatePnl(series, d);
    const tier = Math.min(4, Math.ceil(Math.abs(pnl) / maxAbs * 4));
    const cls = future ? 'future' : pnl > 0.0001 ? 'gain-bg t' + tier : pnl < -0.0001 ? 'loss-bg t' + tier : '';
    const today = d === todayKey() ? ' today' : '';
    let amount = '';
    if (!future) {
      if (metric === 'percent') amount = Math.abs(ret) > 0.000001 ? fmtPct(ret, Math.abs(ret) < 0.001 ? 3 : 2) : '';
      else amount = Math.abs(pnl) > 0.005 ? moneyShort(pnl) : '';
    }
    const pctSmall = metric === 'amount' && !future && Math.abs(ret) > 0.0001 ? '<div class="cal-pct">' + fmtPct(ret, 1) + '</div>' : '';
    cells += '<button class="cal-cell ' + cls + today + '" data-action="open-calendar-day" data-date="' + d + '"' + (future ? ' disabled' : '') + '>' +
      '<span class="cal-day"><span>' + i + '</span>' + (recDates.has(d) ? '<span class="rec-dot"></span>' : '') + '</span>' +
      '<span><span class="cal-amt ' + (pnl > 0 ? 'gain' : pnl < 0 ? 'loss' : '') + '">' + esc(amount) + '</span>' + pctSmall + '</span></button>';
  }
  const trailing = (7 - ((firstDay + total) % 7)) % 7;
  for (let i = 0; i < trailing; i++) cells += '<div class="cal-cell blank"></div>';
  return '<div class="weekdays">' + ['日', '一', '二', '三', '四', '五', '六'].map(x => '<span>' + x + '</span>').join('') + '</div>' +
    '<div class="cal-grid">' + cells + '</div>';
}

function weekCalendarHTML(series, month) {
  const first = startOfMonth(month);
  const last = endOfMonth(month);
  const startSunday = weekStart(first);
  const daily = buildDailyAnalytics();
  const rows = [];
  for (let w = 0; w < 6; w++) {
    const rawWs = addDays(startSunday, w * 7);
    const rawWe = addDays(rawWs, 6);
    if (rawWs > last) break;
    if (rawWe < first) continue;
    const ws = rawWs < first ? first : rawWs;
    const we = rawWe > last ? last : rawWe;
    const end = we > todayKey() ? todayKey() : we;
    if (ws > todayKey()) continue;
    const ps = periodStats(series, ws, end);
    rows.push({ ws, we, ps, idx: w + 1 });
  }
  const maxAbs = Math.max(1, ...rows.map(r => Math.abs(r.ps.pnl)));
  return '<div class="week-list">' + (rows.length ? rows.map(r => {
    const pct = r.ps.returnPct;
    const w = Math.max(2, Math.abs(r.ps.pnl) / maxAbs * 100);
    return '<button class="week-row" data-action="open-calendar-week" data-start="' + r.ws + '">' +
      '<span class="wk"><b>W' + r.idx + '</b><span>' + dateRangeLabel(r.ws, r.we) + '</span></span>' +
      '<span class="wk-main"><span class="r">' + r.ps.positiveDays + ' 天盈利 · ' + r.ps.negativeDays + ' 天亏损</span><span class="week-bar"><i style="width:' + w.toFixed(1) + '%;background:' + (r.ps.pnl >= 0 ? 'var(--gain)' : 'var(--loss)') + '"></i></span></span>' +
      '<span class="wk-val ' + pnlClass(r.ps.pnl) + '">' + (r.ps.pnl >= 0 ? '+' : '') + fmtMoney(r.ps.pnl, { compact: true }) + '<span>' + fmtPct(pct, 2) + '</span></span></button>';
  }).join('') : '<div class="cal-empty">这个月还没有收益记录</div>') + '</div>';
}

function monthCalendarHTML(series, year) {
  let cells = '';
  for (let m = 0; m < 12; m++) {
    const ms = year + '-' + String(m + 1).padStart(2, '0') + '-01';
    if (ms > todayKey()) {
      cells += '<div class="month-cell" style="opacity:.35"><div class="m">' + (m + 1) + '月</div><div class="v faint">—</div><div class="p">未来</div></div>';
      continue;
    }
    const ps = periodStats(series, ms, endOfMonth(ms) < todayKey() ? endOfMonth(ms) : todayKey());
    const active = ms.slice(0, 7) === todayKey().slice(0, 7) ? ' active' : '';
    const tint = ps.pnl > 0 ? 'background:rgba(255,93,108,.055)' : ps.pnl < 0 ? 'background:rgba(53,211,154,.05)' : '';
    cells += '<button class="month-cell' + active + '" style="' + tint + '" data-action="open-calendar-month" data-month="' + ms + '">' +
      '<div><div class="m">' + (m + 1) + '月</div><div class="v ' + pnlClass(ps.pnl) + '">' + (ps.pnl >= 0 ? '+' : '') + fmtMoney(ps.pnl, { compact: true }) + '</div></div>' +
      '<div class="p">' + fmtPct(ps.returnPct, 2) + '</div></button>';
  }
  return '<div class="month-grid">' + cells + '</div>';
}

function yearCalendarHTML(series) {
  const daily = buildDailyAnalytics();
  const firstYear = parseDay(daily.dates[0]).getFullYear();
  const nowYear = parseDay(todayKey()).getFullYear();
  const startYear = Math.max(firstYear, nowYear - 5);
  const rows = [];
  for (let y = nowYear; y >= startYear; y--) {
    const start = y + '-01-01', end = y + '-12-31' > todayKey() ? todayKey() : y + '-12-31';
    const ps = periodStats(series, start, end);
    rows.push({ y, ps });
  }
  const maxAbs = Math.max(1, ...rows.map(r => Math.abs(r.ps.pnl)));
  return '<div class="year-list">' + rows.map(r => {
    const w = Math.max(2, Math.abs(r.ps.pnl) / maxAbs * 100);
    return '<button class="year-row" data-action="open-calendar-year" data-year="' + r.y + '">' +
      '<span class="y">' + r.y + '</span><span class="bar"><i style="width:' + w.toFixed(1) + '%;background:' + (r.ps.pnl >= 0 ? 'var(--gain)' : 'var(--loss)') + '"></i></span>' +
      '<span class="v ' + pnlClass(r.ps.pnl) + '">' + (r.ps.pnl >= 0 ? '+' : '') + fmtMoney(r.ps.pnl, { compact: true }) + '<span>' + fmtPct(r.ps.returnPct, 2) + '</span></span></button>';
  }).join('') + '</div>';
}

function yearInsightHTML(series, year) {
  const months = [];
  for (let m = 0; m < 12; m++) {
    const ms = year + '-' + String(m + 1).padStart(2, '0') + '-01';
    if (ms > todayKey()) { months.push({ m: m + 1, pnl: null, ret: 0 }); continue; }
    const ps = periodStats(series, ms, endOfMonth(ms) < todayKey() ? endOfMonth(ms) : todayKey());
    months.push({ m: m + 1, pnl: ps.pnl, ret: ps.returnPct });
  }
  const known = months.filter(x => x.pnl != null);
  const maxAbs = Math.max(1, ...known.map(x => Math.abs(x.pnl)));
  const best = known.slice().sort((a, b) => b.pnl - a.pnl)[0];
  const worst = known.slice().sort((a, b) => a.pnl - b.pnl)[0];
  const win = known.filter(x => x.pnl > 0).length;
  const bars = months.map(x => {
    if (x.pnl == null) return '<div class="yb-col"><div class="yb-track"><i style="height:2px;bottom:50%;background:rgba(255,255,255,.06)"></i></div><span>' + x.m + '</span></div>';
    const h = Math.max(2, Math.abs(x.pnl) / maxAbs * 42);
    return '<div class="yb-col"><div class="yb-track"><i class="' + (x.pnl >= 0 ? 'up' : 'down') + '" style="height:' + h.toFixed(1) + 'px;' + (x.pnl >= 0 ? 'bottom:50%' : 'top:50%') + '"></i></div><span>' + x.m + '</span></div>';
  }).join('');
  return '<section class="card pad" style="margin-top:14px">' +
    '<div class="card-head" style="padding:0"><div><h2>年度分布</h2><div class="sub">' + year + ' 年 · 每月盈亏</div></div><span class="tiny">' + esc(series.name) + '</span></div>' +
    '<div class="year-bars">' + bars + '</div>' +
    '<div class="cal-mini-stats" style="margin-top:10px"><div><div class="l">最佳月份</div><div class="n gain">' + (best ? best.m + '月 · ' + (best.pnl >= 0 ? '+' : '') + fmtMoney(best.pnl, { compact: true }) : '—') + '</div></div>' +
    '<div><div class="l">最差月份</div><div class="n ' + (worst && worst.pnl < 0 ? 'loss' : '') + '">' + (worst ? worst.m + '月 · ' + fmtMoney(worst.pnl, { compact: true }) : '—') + '</div></div>' +
    '<div><div class="l">盈利月份</div><div class="n">' + win + ' / ' + known.length + '</div></div></div>' +
  '</section>';
}

/* ---------- calendar day sheet ---------- */
function openCalendarDaySheet(date) {
  const sid = calendarSchemeId();
  const gid = calendarGroupId(sid);
  const scheme = schemeById(sid);
  const series = calendarSeries(sid, gid);
  const daily = buildDailyAnalytics();
  const idx = daily.indexMap.get(date);
  const pnl = idx != null ? series.pnls[idx] : 0;
  const prev = idx != null && idx > 0 ? series.values[idx - 1] : 0;
  const ret = prev > 0 ? pnl / prev : 0;
  const gs = groupDailySeries(sid);
  const groupRows = gs.groups.map(g => {
    const p = idx != null ? g.pnls[idx] : 0;
    return { name: g.name, color: g.color, p };
  }).filter(r => Math.abs(r.p) > 0.005)
    .sort((a, b) => Math.abs(b.p) - Math.abs(a.p))
    .slice(0, 5)
    .sort((a, b) => b.p - a.p);
  let dayRecords = recordsSorted().filter(r => r.date === date).reverse();
  if (gid !== 'all') {
    const sch = schemeById(sid);
    dayRecords = dayRecords.filter(r => {
      const account = accountById(r.accountId);
      if (!account) return false;
      const inst = r.instrumentId ? instrumentById(r.instrumentId) : null;
      return resolveGroupId(sch, account, inst) === gid;
    });

  const maxAbs = Math.max(1, ...groupRows.map(r => Math.abs(r.p)));
  const body = '<div class="stat-hero" style="margin-bottom:0"><div><div class="eyebrow">' + esc(date) + ' · ' + weekdayCN(date) + '</div><div class="big ' + pnlClass(pnl) + '" style="font-size:27px">' + (pnl >= 0 ? '+' : '') + fmtMoney(pnl) + '</div><div class="cap">' + esc(series.name) + ' · ' + fmtPct(ret, 2) + ' 当日收益</div></div>' +
    '<div class="right">记录<b>' + dayRecords.length + ' 笔</b><span>当日</span></div></div>' +
    '<div class="bar-list" style="margin-top:18px">' + groupRows.map(r => '<div class="bar-row"><div class="bar-top"><span class="dot" style="background:' + r.color + '"></span><span class="name">' + esc(r.name) + '</span><span class="pct ' + pnlClass(r.p) + '">' + (r.p >= 0 ? '+' : '') + fmtMoney(r.p, { compact: true }) + '</span></div><div class="bar-track"><div class="bar-fill" style="width:' + (Math.abs(r.p) / maxAbs * 100).toFixed(1) + '%;background:' + r.color + '"></div></div></div>').join('') + '</div>' +
    '<div class="divider-line"></div>' +
    (dayRecords.length ? '<div class="list-card" style="background:transparent;border:0">' + dayRecords.map(r => recordRowHTML(r)).join('') + '</div>' : '<div class="tiny" style="padding:14px 0;text-align:center">当天没有买卖或资金记录</div>');

}

function rebalanceSchemeId() {
  const enabled = schemesForRebalance();
  const found = enabled.find(s => s.id === ui.rebalanceSchemeId);
  if (!found) ui.rebalanceSchemeId = (enabled[1] || enabled[0]) ? (enabled[1] || enabled[0]).id : '';
  return ui.rebalanceSchemeId;
}
function seedRebalanceTargets(scheme) {
  if (!scheme || !scheme.builtin) return;
  if (!state.rebalance.targets) state.rebalance.targets = {};
  const existing = state.rebalance.targets[scheme.id] || {};
  if (Object.keys(existing).some(id => Number(existing[id]) > 0)) return;
  const gb = groupBreakdown(scheme.id);
  const targets = {};
  gb.items.forEach(it => { if (it.id !== '__ungrouped') targets[it.id] = round(it.pct * 100, 1); });
  state.rebalance.targets[scheme.id] = targets;
}
function toggleRebalanceScheme(schemeId) {
  const scheme = schemeById(schemeId);
  if (!scheme) return;
  const next = !rebalanceEnabled(scheme);
  setRebalanceEnabled(scheme.id, next);
  if (next && scheme.builtin) seedRebalanceTargets(scheme);
  if (!next && ui.rebalanceSchemeId === scheme.id) ui.rebalanceSchemeId = '';
  saveState();
  toast(next ? (scheme.builtin ? '已开启再平衡，并按当前权重初始化目标' : '已开启再平衡') : '已关闭再平衡', 'success');
  refreshPage();
}

function rebalanceRows(items, tolerance) {
  if (!items.length) return '<div class="tiny" style="padding:20px;text-align:center">还没有分组目标</div>';
  return items.map(it => {
    const current = clamp(it.pct * 100, 0, 100);
    const target = clamp(it.normalizedTarget, 0, 100);
    const left = clamp(target - tolerance, 0, 100);
    const width = clamp(tolerance * 2, 0, 100);
    const statusCls = it.status === 'high' ? 'high' : it.status === 'low' ? 'low' : 'ok';
    const statusText = groupStatusText(it.status);
    const diff = it.drift;
    return '<div class="reb-row">' +
      '<div class="reb-top"><span class="dot" style="background:' + it.color + '"></span><span class="name">' + esc(it.name) + '</span>' +
        '<span class="st ' + statusCls + '">' + statusText + '</span></div>' +
      '<div class="reb-track"><span class="reb-zone" style="left:' + left.toFixed(1) + '%;width:' + width.toFixed(1) + '%"></span>' +
        '<span class="reb-fill" style="width:' + current.toFixed(1) + '%;background:' + it.color + '"></span>' +
        '<span class="reb-target" style="left:calc(' + target.toFixed(1) + '% - 1px)"></span></div>' +
      '<div class="reb-meta"><span>目标 <b>' + target.toFixed(1) + '%</b> · 当前 <b>' + current.toFixed(1) + '%</b> · ' + (it.status === 'high' ? '超出' : it.status === 'low' ? '低于' : '接近') + ' <b class="diff ' + statusCls + '">' + (diff >= 0 ? '+' : '') + diff.toFixed(1) + '%</b></span>' +

/* ---------- rebalance plan ---------- */
function buildRebalancePlan(sid) {
  const gb = groupBreakdown(sid);
  const scheme = gb.scheme;
  const rows = [];
  let buy = 0, sell = 0;
  gb.items.forEach(it => {
    if (it.id === '__ungrouped') return;
    if (it.status !== 'high' && it.status !== 'low') return;
    const delta = it.targetValue - it.value;
    if (Math.abs(delta) < 1) return;
    const side = delta > 0 ? 'buy' : 'sell';
    if (side === 'buy') buy += delta; else sell += Math.abs(delta);
    const comps = groupComponents(sid, it.id).filter(c => c.type === 'instrument' && c.instrument);
    const totalComp = sum(comps, c => c.value) || 1;
    const ops = comps.slice(0, 4).map(c => {
      const amountBase = Math.abs(delta) * (c.value / totalComp);
      const im = computeInstrumentMetrics(c.instrument.id);
      const nativeAmount = amountBase / (im.curFx || 1);
      const approxQty = im.price > 0 ? nativeAmount / im.price : 0;
      return { name: c.instrument.name, amount: amountBase, nativeAmount, currency: c.instrument.currency, qty: approxQty };
    });
    if (!ops.length) {
      rows.push({ side, name: it.name, color: it.color, delta: Math.abs(delta), ops: [], note: side === 'buy' ? '该分组暂无标的，可配置货币基金或现金' : '该分组暂无标的，可减少现金留存' });
    } else {
      rows.push({ side, name: it.name, color: it.color, delta: Math.abs(delta), ops });
    }
  });
  return { gb, scheme, rows, buy, sell };
}

function openRebalancePlanSheet(sid) {
  const plan = buildRebalancePlan(sid || rebalanceSchemeId());
  if (!plan.scheme) { toast('请先开启再平衡', 'error'); return; }

/* ---------- group editor ---------- */
function openGroupEditor(schemeId, groupId) {
  const scheme = schemeById(schemeId);
  if (!scheme || isBuiltinScheme(scheme)) { if (scheme && isBuiltinScheme(scheme)) toast('默认分组不可编辑', 'error'); return; }
  const editing = groupId ? scheme.groups.find(g => g.id === groupId) : null;
  const g = editing || {
    id: '', name: '', color: GROUP_COLORS[scheme.groups.length % GROUP_COLORS.length],
    target: 0, includeAccounts: [], includeCashAccounts: [], includeClasses: [], includeInstruments: []
  };
  const others = scheme.groups.filter(x => !editing || x.id !== editing.id);
  const coveredAccounts = new Map();
  const coveredCash = new Map();
  const coveredInstruments = new Map();
  others.forEach(other => {
    (other.includeAccounts || []).forEach(id => { if (!coveredAccounts.has(id)) coveredAccounts.set(id, other.name); });
    (other.includeCashAccounts || []).forEach(id => { if (!coveredCash.has(id)) coveredCash.set(id, other.name); });
    (other.includeInstruments || []).forEach(id => { if (!coveredInstruments.has(id)) coveredInstruments.set(id, other.name); });
  });
  const coveredMark = name => '<span class="covered-tag">已在「' + esc(name) + '」</span>';
  const tree = accounts().map(a => {
    const accountChecked = (g.includeAccounts || []).indexOf(a.id) >= 0;
    const accountCoveredBy = coveredAccounts.get(a.id);
    const cashCoveredBy = accountCoveredBy || coveredCash.get(a.id);
    const instrumentCoverage = a.instruments.map(inst => accountCoveredBy || coveredInstruments.get(inst.id));
    const hasCoveredChild = !!cashCoveredBy || instrumentCoverage.some(Boolean);
    const accountDisabled = !!accountCoveredBy || hasCoveredChild;
    const accountNote = accountCoveredBy ? coveredMark(accountCoveredBy) : hasCoveredChild ? '<span class="covered-hint">部分成员已占用</span>' : '';
    const cashChecked = accountChecked || (g.includeCashAccounts || []).indexOf(a.id) >= 0;
    const cashRow = '<label class="check-row tree-inst tree-child tree-cash' + (cashCoveredBy ? ' covered' : '') + '"><input type="checkbox" name="cashAccounts" value="' + esc(a.id) + '" data-account="' + esc(a.id) + '" data-covered="' + (cashCoveredBy ? '1' : '0') + '"' + (cashChecked ? ' checked' : '') + (accountChecked || cashCoveredBy ? ' disabled' : '') + '><span class="checkbox ' + (cashChecked ? 'checked' : '') + '">' + icon('check') + '</span>' +
      '<span class="check-name">账户现金' + (cashCoveredBy ? coveredMark(cashCoveredBy) : '') + '<span class="check-sub">' + a.currency + ' · 可用现金 ' + fmtMoney(computeAccountMetrics(a.id).cashBase, { compact: true }) + '</span></span></label>';
    const instrumentRows = a.instruments.map((inst, ii) => {
      const coveredBy = instrumentCoverage[ii];
      const checked = accountChecked || (g.includeInstruments || []).indexOf(inst.id) >= 0;
      return '<label class="check-row tree-inst tree-child' + (coveredBy ? ' covered' : '') + '"><input type="checkbox" name="instruments" value="' + esc(inst.id) + '" data-account="' + esc(a.id) + '" data-covered="' + (coveredBy ? '1' : '0') + '"' + (checked ? ' checked' : '') + (accountChecked || coveredBy ? ' disabled' : '') + '><span class="checkbox ' + (checked ? 'checked' : '') + '">' + icon('check') + '</span>' +
        '<span class="check-name">' + esc(inst.name) + (coveredBy ? coveredMark(coveredBy) : '') + '<span class="check-sub">' + esc(inst.symbol) + ' · ' + esc(instrumentTypeName(inst.cls)) + '</span></span></label>';
    }).join('');
    return '<div class="tree-account">' +
      '<label class="check-row tree-account-row' + (accountDisabled ? ' covered' : '') + '"><input type="checkbox" name="accounts" value="' + esc(a.id) + '" data-covered="' + (accountDisabled ? '1' : '0') + '"' + (accountChecked ? ' checked' : '') + (accountDisabled ? ' disabled' : '') + '><span class="checkbox ' + (accountChecked ? 'checked' : '') + '">' + icon('check') + '</span>' +
        '<span class="check-name">' + esc(a.name) + accountNote + '<span class="check-sub">' + esc(accountTypeName(a.type)) + ' · ' + a.currency + ' · ' + a.instruments.length + ' 个标的</span></span></label>' +
      '<div class="tree-children">' + cashRow + instrumentRows + '</div>' +
    '</div>';
  }).join('');

  const colors = ['#ff9f45', '#5b8cff', '#b18cff', '#43d6b0', '#f2c45c', '#ff7aa2', '#7c9cff', '#ff5d6c', '#8e9aaf', '#f7931a'];
  const body = '<form id="group-form" data-scheme="' + esc(scheme.id) + '" data-group="' + esc(editing ? editing.id : '') + '">' +
    '<div class="form-grid">' +
      fieldHTML({ id: 'group-name', label: '分组名称', value: g.name, placeholder: '例如：稳健投资', full: true }) +
      fieldHTML({ id: 'group-target', label: '目标占比', value: Number(g.target) || 0, unit: '%', inputmode: 'decimal' }) +
      '<div class="field"><label>分组颜色</label><div class="color-row">' + colors.map(c => '<button type="button" class="color-dot ' + (c === g.color ? 'active' : '') + '" style="background:' + c + '" data-color="' + c + '" aria-label="选择颜色"></button>').join('') + '</div><input type="hidden" name="group-color" id="group-color" value="' + g.color + '"></div>' +
    '</div>' +
    '<div class="form-section">选择账户与标的</div>' +
    '<div class="form-hint">勾选账户会包含该账户现金和全部标的；若只选账户现金或部分标的，先取消勾选账户，再在下面单独勾选。已被其他分组选择的成员会置灰。</div>' +
    '<div class="check-list account-tree">' + (tree || '<div class="tiny">还没有账户</div>') + '</div>' +
    '<div class="info-banner" style="margin-top:14px">' + icon('info') + '<div>保存后，符合本组条件的资产会从其他分组中移出；实际归属按分组列表顺序决定。</div></div>' +
    (editing ? '<button type="button" class="btn danger wide" style="margin-top:14px" data-group-delete>' + icon('trash') + '删除这个分组</button>' : '') +
  '</form>';
  const wrap = openSheet({
    title: editing ? '编辑分组' : '添加分组', sub: scheme.name,
    body, footer: '<button class="btn ghost" data-sheet-close>取消</button><button class="btn primary" data-group-save>' + (editing ? '保存' : '添加') + '</button>'
  });
  const form = wrap.querySelector('#group-form');
  form.querySelectorAll('.color-dot').forEach(btn => btn.addEventListener('click', () => {
    form.querySelectorAll('.color-dot').forEach(x => x.classList.remove('active'));
    btn.classList.add('active');
    form.querySelector('#group-color').value = btn.getAttribute('data-color');
  }));
  form.querySelectorAll('.check-row input[type="checkbox"]').forEach(inp => {
    inp.addEventListener('change', () => {
      const box = inp.parentNode.querySelector('.checkbox');
      if (box) box.classList.toggle('checked', inp.checked);
    });
  });
  const treeEl = form.querySelector('.account-tree');
  if (treeEl) {
    treeEl.querySelectorAll('.tree-account').forEach(box => {
      const main = box.querySelector('.tree-account-row input[type="checkbox"]');
      const children = Array.from(box.querySelectorAll('.tree-child input[type="checkbox"]'));
      const sync = (initial) => {
        children.forEach(inp => {
          const covered = inp.dataset.covered === '1';
          inp.disabled = main.checked || covered;
          if (main.checked) inp.checked = true;
          else if (!initial && !covered) inp.checked = false;
          const cb = inp.parentNode.querySelector('.checkbox');
          if (cb) cb.classList.toggle('checked', inp.checked);
        });
      };
      main.addEventListener('change', () => sync(false));
      sync(true);
    });
    treeEl.querySelectorAll('.tree-child input[type="checkbox"]').forEach(inp => {
      inp.addEventListener('change', () => {
        const cb = inp.parentNode.querySelector('.checkbox');
        if (cb) cb.classList.toggle('checked', inp.checked);
      });
    });
  }
  const delBtn = wrap.querySelector('[data-group-delete]');
  if (delBtn) delBtn.addEventListener('click', () => {
    setTimeout(() => {
      confirmDialog({
        title: '删除「' + editing.name + '」？',
        message: '这个分组会从分组方式中移除，账户和交易记录不受影响。',
        confirmText: '删除', danger: true,
        onConfirm: () => {
          scheme.groups = scheme.groups.filter(x => x.id !== editing.id);
          if (ui.statsSchemeId === scheme.id) { /* 保留当前方式 */ }
          if (ui.rebalanceSchemeId === scheme.id) { /* 保留 */ }
          if (ui.calendarGroupId === editing.id) ui.calendarGroupId = 'all';
          saveState(); closeAllSheets(); toast('分组已删除');
          refreshPage();
        }
      });
    }, 60);
  });
  wrap.querySelector('[data-group-save]').addEventListener('click', () => {
    const name = cleanText(form.querySelector('#group-name').value, 24);
    if (!name) { toast('请填写分组名称', 'error'); return; }
    const target = clamp(parseNumber(form.querySelector('#group-target').value), 0, 100);
    const color = form.querySelector('#group-color').value || '#ff9f45';
    const includeAccounts = Array.from(form.querySelectorAll('input[name="accounts"]:checked:not(:disabled)')).map(x => x.value);
    const includeInstruments = Array.from(form.querySelectorAll('input[name="instruments"]:checked:not(:disabled)')).map(x => x.value);
    const includeCashAccounts = Array.from(form.querySelectorAll('input[name="cashAccounts"]:checked:not(:disabled)')).map(x => x.value);
    if (editing) {
      editing.name = name; editing.target = target; editing.color = color;
      editing.includeAccounts = includeAccounts; editing.includeCashAccounts = includeCashAccounts; editing.includeInstruments = includeInstruments; editing.includeClasses = [];
    } else {
      scheme.groups.push({ id: uid('grp'), name, target, color, includeAccounts, includeCashAccounts, includeClasses: [], includeInstruments });
    }
    saveState();
    closeSheet(wrap);
    toast(editing ? '分组已更新' : '分组已添加', 'success');
    if (parseRoute().name === 'groups') refreshPage();
    else renderPage({ scroll: false });
  });
}
function checkRowHTML(name, value, label, sub, checked, isBoolean) {
  return '<label class="check-row"><input type="checkbox" name="' + name + '" value="' + esc(value) + '"' + (checked ? ' checked' : '') + '><span class="checkbox ' + (checked ? 'checked' : '') + '">' + icon('check') + '</span>' +
    '<span class="check-name">' + esc(label) + (sub ? '<span class="check-sub">' + esc(sub) + '</span>' : '') + '</span></label>';
}

}

/* ---------- data actions ---------- */
function downloadBackup() {
  const text = exportData();
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'youyu-backup-' + todayKey() + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
  toast('备份文件已生成', 'success');
}
function triggerImport() {
  const input = $('#import-file');
  if (input) input.click();
}
function handleImportFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      confirmDialog({
        title: '导入账本？',
        message: '导入会覆盖当前所有账户、记录和设置。建议先导出备份。',
        confirmText: '确认导入',
        onConfirm: () => {
          try {
            importData(String(reader.result || ''));
            closeAllSheets();
            toast('账本导入成功', 'success');
            navigate('#/assets', true);
            renderPage();
          } catch (e) {
            toast('导入失败：' + e.message, 'error');
          }
        }
      });
    } catch (e) { toast('文件读取失败', 'error'); }
  };
  reader.readAsText(file);
}
function makeEmptyState() {
  const s = buildSeed();
  s.isDemo = false;
  s.accounts = [];
  s.records = [];
  s.prices = {};
  s.fxHistory = {};
  s.meta.name = '我的投资组合';
  s.schemes = [{
    id: 'scheme_account', name: '账户归属', desc: '按资金所在账户划分',
    groups: [
      { id: 'g_domestic', name: '境内账户', color: '#ff9f45', target: 60, includeAccounts: [], includeClasses: [], includeInstruments: [] },
      { id: 'g_global', name: '境外账户', color: '#5b8cff', target: 40, includeAccounts: [], includeClasses: [], includeInstruments: [] }
    ]
  }];
  return s;
}
function switchDataMode(toDemo) {
  saveState(true);
  if (toDemo) {
    const saved = readStoredState(DEMO_STORE_KEY);
    state = saved || buildSeed();
    demoMode = true;
  } else {
    const saved = readStoredState(STORE_KEY);
    state = saved || makeEmptyState();
    demoMode = false;
  }
  normalizeState(state);
  ensureRates();
  saveState(true);
  ui = defaultUi();
  closeAllSheets();
  navigate('#/assets', true);
  renderPage({ scroll: true });
  toast(toDemo ? '已切换到演示账本' : '已切换到我的账本', 'success');
  if (toDemo) setTimeout(() => { hydrateDemoLedger().catch(e => console.warn('演示数据同步失败', e)); }, 500);
}
function resetDemo() {
  if (!demoMode) { switchDataMode(true); return; }
  state = buildSeed();
  normalizeState(state);
  demoMode = true;
  ensureRates();
  saveState(true);
  ui = defaultUi();
  closeAllSheets();
  toast('示例数据已重置', 'success');
  navigate('#/assets', true);
  renderPage({ scroll: true });
  setTimeout(() => { hydrateDemoLedger().catch(e => console.warn('演示数据同步失败', e)); }, 500);
}

  confirmDialog({
    title: demoMode ? '重置示例账本？' : '清空整个账本？', message: demoMode ? '示例账本会恢复为初始演示组合，真实账本不受影响。' : '所有账户、交易、价格与分组设置都会被删除，且无法恢复。', confirmText: demoMode ? '确认重置' : '确认清空', danger: true,
    onConfirm: () => {
      if (demoMode) { resetDemo(); return; }

      saveState();
      ui = defaultUi();
      closeAllSheets();

    body, footer: '<button class="btn ghost" data-sheet-close>取消</button><button class="btn primary" data-inst-save>' + (editing ? '保存' : '添加标的') + '</button>'
  });
  const form = wrap.querySelector('#instrument-form');
  let selectedMarket = editing && editing.market ? JSON.parse(JSON.stringify(editing.market)) : null;
  const marketStatus = form.querySelector('#market-status');
  const marketResults = form.querySelector('#market-results');
  const marketQuery = form.querySelector('#market-query');
  let searchTimer = null;
  const setMarketStatus = (html, cls) => {
    if (!marketStatus) return;
    marketStatus.className = 'market-status ' + (cls || '');
    marketStatus.innerHTML = html;
  };
  const showMarketStatus = () => {
    if (selectedMarket) {
      setMarketStatus('已连接 <b>' + esc(selectedMarket.label || '') + '</b> · ' + esc(selectedMarket.symbol || '') + (selectedMarket.lastUpdated ? ' · ' + esc(selectedMarket.lastUpdated) : '') + ' · 可手动刷新行情', 'ok');
    } else if (!editing) {
      setMarketStatus('支持 A股、场外基金、场内 ETF、美股、港股、债券。选中后自动填入最新价格。');
    }
  };
  const fillFromMarket = (meta, quote) => {
    form.querySelector('#inst-name').value = meta.name || '';
    form.querySelector('#inst-symbol').value = meta.symbol || meta.code || '';
    const clsSel = form.querySelector('#inst-class');
    if (clsSel && meta.cls) clsSel.value = meta.cls;
    const priceInput = form.querySelector('#inst-price');
    if (priceInput && quote && quote.price > 0) priceInput.value = String(quote.price);
    const unit = form.querySelector('#inst-cost-unit');
    if (unit && meta.currency) unit.textContent = meta.currency;
    selectedMarket = Object.assign({}, meta, quote ? { lastPrice: quote.price, lastUpdated: normalizeMarketTime(quote.time) } : {});
    showMarketStatus();
  };
  const pickMarketResult = async (meta) => {
    if (meta.currency && meta.currency !== account.currency) {
      setMarketStatus('该行情币种为 ' + esc(meta.currency) + '，与当前账户币种 ' + esc(account.currency) + ' 不一致。请先创建对应币种的账户，再添加该标的。', 'warn');
      return;
    }
    marketResults.innerHTML = '';
    setMarketStatus('正在获取 <b>' + esc(meta.name) + '</b> 的最新行情…');
    try {
      const quote = await fetchTencentQuote(meta);
      fillFromMarket(meta, quote);
      setMarketStatus('已匹配 <b>' + esc(meta.name) + '</b> · 最新价 ' + fmtPrice(quote.price, meta.currency) + ' · ' + esc(normalizeMarketTime(quote.time)), 'ok');
    } catch (e) {
      fillFromMarket(meta, null);
      setMarketStatus('已选择 <b>' + esc(meta.name) + '</b>，但行情获取失败，请手动填写价格后保存。', 'warn');
    }
  };
  const runMarketSearch = async () => {
    const q = marketQuery.value.trim();
    if (!q) { marketResults.innerHTML = ''; setMarketStatus('输入名称或代码后搜索，例如：贵州茅台、AAPL、110008。'); return; }
    setMarketStatus('正在搜索「' + esc(q) + '」…');
    try {
      const results = await marketSearch(q);
      if (!results.length) {
        marketResults.innerHTML = '';
        setMarketStatus('没有匹配到「' + esc(q) + '」。可尝试输入代码，或直接手动填写。', 'warn');
        return;
      }
      marketResults.innerHTML = results.map((r, i) => '<button type="button" class="market-result" data-market-index="' + i + '"><span class="mr-main"><b>' + esc(r.name) + '</b><em>' + esc(r.symbol) + ' · ' + esc(r.label) + '</em></span><span class="mr-arrow">' + icon('chevronRight') + '</span></button>').join('');
      marketResults.querySelectorAll('[data-market-index]').forEach(btn => btn.addEventListener('click', () => pickMarketResult(results[Number(btn.getAttribute('data-market-index'))])));
      setMarketStatus('找到 ' + results.length + ' 个匹配，选择一个自动填入。', 'ok');
    } catch (e) {
      marketResults.innerHTML = '';
      setMarketStatus('行情搜索暂不可用，请检查网络，或直接手动填写。', 'warn');
    }
  };
  if (marketQuery) {
    marketQuery.addEventListener('input', () => {
      clearTimeout(searchTimer);
      const q = marketQuery.value.trim();
      if (q.length < 2) { marketResults.innerHTML = ''; setMarketStatus('输入至少 2 个字符开始搜索。'); return; }
      searchTimer = setTimeout(runMarketSearch, 450);
    });
    marketQuery.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); runMarketSearch(); } });
  }
  const searchBtn = form.querySelector('#market-search-btn');
  if (searchBtn) searchBtn.addEventListener('click', runMarketSearch);
  showMarketStatus();
  form.querySelectorAll('.color-dot').forEach(btn => btn.addEventListener('click', () => {
    form.querySelectorAll('.color-dot').forEach(x => x.classList.remove('active'));
    btn.classList.add('active');
    form.querySelector('#inst-color').value = btn.getAttribute('data-color');
  }));
  wrap.querySelector('[data-inst-save]').addEventListener('click', () => {
    const name = cleanText(form.querySelector('#inst-name').value, 30);
    if (!name) { toast('请填写标的名称', 'error'); return; }
    const symbol = cleanText(form.querySelector('#inst-symbol').value, 16) || name.slice(0, 6);
    const cls = form.querySelector('#inst-class').value || 'other';
    const currency = account.currency;
    const color = form.querySelector('#inst-color').value || '#ff9f45';
    const note = cleanText(form.querySelector('#inst-note').value, 40);
    const price = Math.max(0, parseNumber(form.querySelector('#inst-price').value));
    if (!editing && !(price > 0)) { toast('请输入当前价格或净值', 'error'); return; }
    if (editing && editing.currency && editing.currency !== account.currency) {
      toast('该标的币种与账户币种不一致，请将该标的拆分到对应币种账户', 'error');
      return;
    }
    state.isDemo = false;
    if (editing) {
      editing.name = name; editing.symbol = symbol; editing.cls = cls; editing.color = color;
      editing.note = note; editing.color2 = shadeColor(color, -18);
      editing.market = selectedMarket || null;
      if (price > 0 && Math.abs(price - priceNow(editing.id)) > 0.0000001) {
        upsertPricePoint(editing.id, todayKey(), price);
        state.records.push({ id: uid('rec'), date: todayKey(), type: 'price', accountId: account.id, instrumentId: editing.id, amount: 0, qty: 0, price, fee: 0, fxRate: fxAt(currency, todayKey()), note: '估值更新', createdAt: nowISO() });
      }
      saveState(); closeSheet(wrap); toast('标的已更新', 'success'); refreshPage(); return;
    }
    const id = uid('inst');
    const inst = { id, accountId: account.id, name, symbol, cls, currency, color, color2: shadeColor(color, -18), note, market: selectedMarket || null };
    account.instruments.push(inst);
    state.prices[id] = [[todayKey(), price > 0 ? price : 1, 'record']];
    const qty = Math.max(0, parseNumber(form.querySelector('#inst-qty') ? form.querySelector('#inst-qty').value : 0));
    if (qty > 0) {
      const cost = parseNumber(form.querySelector('#inst-cost') ? form.querySelector('#inst-cost').value : 0) || price || 1;
      state.records.push({
        id: uid('rec'), date: todayKey(), type: 'buy', accountId: account.id, instrumentId: id,
        amount: round(qty * cost, 2), qty, price: cost, fee: 0, fxRate: fxAt(currency, todayKey()), note: '初始建仓', createdAt: nowISO()
      });
    }
    saveState(); closeSheet(wrap); toast('标的已添加', 'success');
    navigate('#/instrument/' + encodeURIComponent(id));
  });
}

/* ---------- color helper ---------- */
function shadeColor(hex, percent) {
  const h = String(hex || '#ff9f45').replace('#', '');
  if (h.length !== 6) return hex;
  const num = parseInt(h, 16);
  let r = (num >> 16) + Math.round(255 * percent / 100);
  let g = ((num >> 8) & 0x00FF) + Math.round(255 * percent / 100);
  let b = (num & 0x0000FF) + Math.round(255 * percent / 100);
  r = clamp(r, 0, 255); g = clamp(g, 0, 255); b = clamp(b, 0, 255);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

/* =========================================================
   12b · 行情匹配 / 搜索 / 报价同步
   数据源：新浪财经搜索（JSONP）+ 腾讯行情（CORS）
   ========================================================= */
const MARKET_SEARCH_TYPES = '11,21,22,23,31,41,81,201,202,203';
let marketSearchSeq = 0;

function marketFundClass(name) {
  const n = String(name || '');
  if (/货币|现金|理财|余额/.test(n)) return 'moneyFund';
  if (/债|固收|稳健|短债|纯债|存单/.test(n)) return 'bondFund';
  return 'equityFund';
}
function marketMetaFromSina(fields) {
  const type = String(fields[1] || '');
  const code = String(fields[2] || '').trim();
  const qcode = String(fields[3] || '').trim();
  let name = String(fields[4] || fields[0] || '').trim();
  if (!code || !qcode || !name) return null;
  if (MARKET_SEARCH_TYPES.split(',').indexOf(type) < 0) return null;
  let quoteCode = qcode;
  let marketType = '';
  let label = '';
  let currency = 'CNY';
  let cls = 'stock';
  let symbol = code;
  if (type === '41') {
    marketType = 'US';
    label = '美股';
    currency = 'USD';
    symbol = code.toUpperCase();
    quoteCode = 'us' + code.replace(/\..*$/, '').toUpperCase();
    cls = /ETF|指数|S&P|VANGUARD|ISHARES|SPDR|INVESCO/i.test(name) ? 'etf' : 'stock';
  } else if (type === '31') {
    marketType = 'HK';
    label = '港股';
    currency = 'HKD';
    quoteCode = 'hk' + code;
    cls = /ETF|指数/i.test(name) ? 'etf' : 'stock';
  } else if (qcode.indexOf('of') === 0) {
    marketType = 'FUND';
    label = '场外基金';
    quoteCode = 'jj' + code;
    cls = marketFundClass(name);
  } else if (qcode.indexOf('sh') === 0 || qcode.indexOf('sz') === 0) {
    marketType = type === '81' ? 'BOND' : (/ETF|LOF/i.test(name) || ['22', '23', '202', '203'].indexOf(type) >= 0 ? 'ETF' : 'A');
    label = type === '81' ? '债券' : (marketType === 'ETF' ? '场内基金' : 'A股');
    if (type === '81') cls = 'bond';
    else if (marketType === 'ETF') cls = /债|国债|转债|信用债/.test(name) ? 'bondFund' : 'etf';
    else cls = 'stock';
  } else {
    return null;
  }
  if (marketType === 'A' && (/^sh000/.test(quoteCode) || /^sz399/.test(quoteCode))) return null;
  return {
    provider: 'tencent', code: quoteCode, marketType, label, symbol, name,
    currency, cls, sourceType: type
  };
}
function parseSinaSuggest(raw, query) {
  const q = String(query || '').trim().toLowerCase();
  const map = new Map();
  String(raw || '').split(';').forEach(part => {
    if (!part) return;
    const fields = part.split(',');
    const meta = marketMetaFromSina(fields);
    if (!meta) return;
    const existing = map.get(meta.code);
    if (!existing) { map.set(meta.code, meta); return; }
    const rank = q => q.indexOf('sh') === 0 || q.indexOf('sz') === 0 ? 2 : q.indexOf('of') === 0 ? 1 : 0;
    if (rank(meta.code) > rank(existing.code)) map.set(meta.code, meta);

  const priority = { A: 1, FUND: 2, ETF: 3, US: 4, HK: 5, BOND: 6 };
  const score = meta => {
    if (!q) return 0;
    const name = String(meta.name || '').toLowerCase();
    const sym = String(meta.symbol || '').toLowerCase();
    let n = 0;
    if (sym === q || name === q) n += 200;
    if (sym.indexOf(q) === 0) n += 80;
    if (name.indexOf(q) === 0) n += 60;
    else if (name.indexOf(q) >= 0) n += 30;
    if (String(meta.code || '').toLowerCase().indexOf(q) >= 0) n += 20;
    return n;
  };

async function fetchTencentQuote(market) {
  if (!market || !market.code) throw new Error('未绑定行情代码');
  const res = await fetch('https://qt.gtimg.cn/q=' + encodeURIComponent(market.code) + '&_=' + Date.now(), {
    cache: 'no-store',
    mode: 'cors'
  });
  if (!res.ok) throw new Error('行情请求失败');
  let text = '';
  try {
    const buffer = await res.arrayBuffer();
    text = new TextDecoder('gbk').decode(buffer);
  } catch (e) {
    text = await res.text();
  }
  const m = text.match(/="([^"]*)"/);
  if (!m) throw new Error('未找到行情数据');
  const f = m[1].split('~');
  let price = 0, time = '', changePct = 0, prevClose = 0;
  if (market.code.indexOf('jj') === 0) {

    time = f[8] || '';

    time = f[30] || '';

  return { price, prevClose, changePct, time, name: f[1] || market.name, currency: market.currency };
}
function normalizeMarketTime(t) {

}
function quoteDateFrom(time) {

}

async function autoRefreshMarketQuotes() {

async function ensureInstrumentHistory(id, opts) {
  const o = opts || {};
  const found = instrumentById(id);
  if (!found || !found.market || !found.market.code) return false;
  const actual = (accountById(found.accountId) || { instruments: [] }).instruments.find(x => x.id === id);
  if (!actual || actual.market.historyLoaded || historyLoadingIds.has(id)) return !!(actual && actual.market.historyLoaded);
  historyLoadingIds.add(id);
  try {
    let rows = [];
    const code = actual.market.code;
    if (code.indexOf('jj') === 0) rows = await fetchFundHistory(actual.market);
    else if (code.indexOf('us') === 0) rows = await fetchSinaUSHistory(actual.market);
    else if (/^(sh|sz)/.test(code)) {
      try { rows = await fetchSinaCNHistory(actual.market); } catch (e) { rows = await fetchTencentHistory(actual.market); }
    } else rows = await fetchTencentHistory(actual.market);
    rows = rows.filter(x => x[0] <= todayKey()).slice(-2000);
    if (!rows.length) throw new Error('没有历史行情');
    rows.forEach(([date, price]) => upsertPricePoint(id, date, price, 'market'));
    actual.market = Object.assign({}, actual.market, {
      historyLoaded: true,
      historySyncedAt: nowISO(),
      historyCount: rows.length
    });
    historyLoadingIds.delete(id);
    saveState();
    if (!o.noRefresh && parseRoute().name === 'instrument' && parseRoute().id === id && !document.querySelector('.overlay')) refreshPage();
    return true;
  } catch (e) {
    historyLoadingIds.delete(id);
    console.warn('历史行情获取失败', id, e);
    return false;
  }
}

async function hydrateDemoLedger() {
  if (!demoMode || !state || !state.meta || state.meta.demoHydrated) return;
  const targetState = state;
  const list = [];
  accounts().forEach(a => (a.instruments || []).forEach(i => { if (i.market && i.market.code) list.push(i.id); }));
  if (!list.length) { state.meta.demoHydrated = true; saveState(true); return; }
  let all = true;
  for (const id of list) {
    if (state !== targetState || !demoMode) return;
    const ok = await ensureInstrumentHistory(id, { noRefresh: true });
    all = all && ok;
    await new Promise(resolve => setTimeout(resolve, 180));
  }
  if (state !== targetState || !demoMode) return;
  const closeAt = (id, date) => {
    const pts = (state.prices[id] || []).filter(p => p[2] === 'market' && p[0] <= date);
    return pts.length ? Number(pts[pts.length - 1][1]) : null;
  };
  state.records.forEach(rec => {
    if (!rec.instrumentId || (rec.type !== 'buy' && rec.type !== 'sell' && rec.type !== 'price')) return;
    const inst = instrumentById(rec.instrumentId);
    if (!inst || !inst.market) return;
    const price = closeAt(rec.instrumentId, rec.date);
    if (!(price > 0)) return;
    if (rec.type === 'price') { rec.price = price; return; }
    rec.price = price;
    rec.amount = round((Number(rec.qty) || 0) * price, 2);
    rec.fee = inst.cls === 'stock' || inst.cls === 'etf' ? Math.max(1, round(rec.amount * 0.0004, 2)) : 0;
  });
  accounts().forEach(account => {
    const recs = state.records.filter(r => r.accountId === account.id);
    const spec = SEED_SPECS[account.id];
    if (!spec) return;
    let buyCost = 0, sellProceeds = 0, income = 0, otherDep = 0, withdrawals = 0;
    recs.forEach(r => {
      if (r.type === 'buy') buyCost += (Number(r.amount) || 0) + (Number(r.fee) || 0);
      else if (r.type === 'sell') sellProceeds += (Number(r.amount) || 0) - (Number(r.fee) || 0);
      else if (r.type === 'dividend' || r.type === 'interest') income += Number(r.amount) || 0;
      else if (r.type === 'withdraw') withdrawals += Number(r.amount) || 0;
      else if (r.type === 'deposit' && r.note !== '初始资金') otherDep += Number(r.amount) || 0;
    });
    const initial = round((Number(spec.targetCash) || 0) - otherDep + withdrawals + buyCost - sellProceeds - income, 2);
    const initialRec = recs.find(r => r.type === 'deposit' && r.note === '初始资金') || recs.find(r => r.type === 'deposit' && r.date === seedDate(-496));
    if (initialRec) initialRec.amount = Math.max(0, initial);
  });
  state.meta.demoHydrated = true;
  state.meta.demoHydratedAt = nowISO();
  saveState(true);
  if (!document.querySelector('.overlay') && demoMode) refreshPage();
}

async function ensureAccountHistories(accountId) {
  const account = accountById(accountId);
  if (!account) return;
  const pending = (account.instruments || []).filter(i => i.market && i.market.code && !i.market.historyLoaded).map(i => i.id);
  if (!pending.length) return;
  for (const id of pending) {

  if (route.name === 'account' && route.id === accountId && !document.querySelector('.overlay')) refreshPage();

    calendarMetric: 'amount',
    calendarMonth: startOfMonth(todayKey()),
    calendarYear: parseDay(todayKey()).getFullYear(),
    sankeyMode: 'account'
  };
}

function handleAction(action, el) {
  const d = el.dataset || {};
  switch (action) {
    case 'back': goBack(d.fallback || '#/assets'); return;
    case 'go': closeAllSheets(); navigate(d.href || '#/assets'); return;
    case 'noop': return;
    case 'toggle-hide':
      state.settings.hideAmounts = !state.settings.hideAmounts;
      saveState(); refreshPage(); return;
    case 'toggle-theme': state.settings.theme = state.settings.theme === 'light' ? 'dark' : 'light'; try { localStorage.setItem(THEME_KEY, state.settings.theme); } catch (e) {} applyTheme(); saveState(); refreshPage(); toast(state.settings.theme === 'light' ? '已切换到日间模式' : '已切换到夜间模式', 'success'); return;
    case 'toggle-fx':
      state.settings.considerFx = !state.settings.considerFx;
      saveState();
      toast(state.settings.considerFx ? '已计入汇率影响' : '已按本币价格统计', 'success');
      refreshPage(); return;

    case 'open-add-account':
      closeAllSheets(); setTimeout(() => openAccountForm(), 50); return;
    case 'open-add-instrument':
      closeAllSheets(); setTimeout(() => openInstrumentForm(d.account), 50); return;
    case 'open-record-picker':
      closeAllSheets(); setTimeout(openRecordPicker, 50); return;
    case 'add-record-account':
      closeAllSheets(); setTimeout(() => openRecordChooser(d.account), 50); return;
    case 'add-record-instrument': {
      const im = instrumentById(d.instrument);
      if (!im) return;
      closeAllSheets(); setTimeout(() => openRecordChooser(im.account.id, im.id), 50); return;
    }
    case 'open-price-update': {
      const im = instrumentById(d.instrument);
      if (!im) return;
      closeAllSheets(); setTimeout(() => openRecordForm(im.account.id, 'price', im.id), 50); return;
    }
    case 'open-account-menu':
      closeAllSheets(); setTimeout(() => openAccountMenu(d.id), 50); return;
    case 'open-instrument-menu':
      closeAllSheets(); setTimeout(() => openInstrumentMenu(d.id), 50); return;
    case 'refresh-quote':
      closeAllSheets(); setTimeout(() => refreshQuoteForInstrument(d.id), 50); return;
    case 'match-market': {
      const im = instrumentById(d.id);
      if (!im) return;
      closeAllSheets(); setTimeout(() => openInstrumentForm(im.account.id, im.id), 50); return;
    }
    case 'edit-account':
      closeAllSheets(); setTimeout(() => openAccountForm(d.id), 50); return;
    case 'edit-instrument': {
      const im = instrumentById(d.id);
      if (!im) return;
      closeAllSheets(); setTimeout(() => openInstrumentForm(im.account.id, im.id), 50); return;
    }
    case 'open-records':
      closeAllSheets(); setTimeout(() => openRecordsSheet(d.scope, d.id), 50); return;
    case 'delete-account':
      setTimeout(() => deleteAccountById(d.id), 50); return;
    case 'delete-instrument':
      setTimeout(() => deleteInstrumentById(d.id), 50); return;
    case 'edit-record': {
      const rec = state.records.find(r => r.id === d.id);
      if (!rec) return;
      if (rec.type === 'flow') {
        closeAllSheets();
        const scope = rec.instrumentId ? 'instrument' : 'account';
        const targetId = rec.instrumentId || rec.accountId;
        setTimeout(() => openFlowFieldEditor(scope, targetId, rec.periodKey, rec.flowField), 50);
        return;
      }
      closeAllSheets();
      setTimeout(() => openRecordForm(rec.accountId, rec.type, rec.instrumentId, rec.id), 50);
      return;
    }
    case 'delete-record': {
      const rec = state.records.find(r => r.id === d.id);
      if (!rec) return;
      setTimeout(() => confirmDialog({
        title: '删除这条记录？', message: dateRangeLabel(rec.date, rec.date) + ' · ' + recordTitle(rec) + '。删除后相关统计会重新计算。', confirmText: '删除', danger: true,
        onConfirm: () => { deleteRecord(rec.id); closeAllSheets(); toast('记录已删除'); refreshPage(); }
      }), 80);
      return;
    }

    case 'set-account-period': ui.accountPeriod = Number(d.value); refreshPage(); return;
    case 'set-account-chart-mode': ui.accountChartMode = d.value; refreshPage(); return;
    case 'set-instrument-period': ui.instrumentPeriod = Number(d.value); refreshPage(); return;
    case 'set-instrument-chart-mode': ui.instrumentChartMode = d.value; refreshPage(); return;
    case 'set-trend-period': ui.trendPeriod = Number(d.value); refreshPage(); return;
    case 'set-trend-metric': ui.trendMetric = d.value === 'percent' ? 'percent' : 'amount'; refreshPage(); return;
    case 'set-flow-period': {
      const map = d.scope === 'account' ? (ui.flowAccountPeriod || (ui.flowAccountPeriod = {})) : (ui.flowInstrumentPeriod || (ui.flowInstrumentPeriod = {}));
      map[d.id] = d.period;
      refreshPage(); return;
    }
    case 'edit-flow-field': openFlowFieldEditor(d.scope, d.id, d.period, d.field); return;
    case 'reset-flow': resetFlowAdjustments(d.scope, d.id, d.period); return;
    case 'select-stats-scheme': ui.statsSchemeId = d.id; ui.sankeyMode = ui.sankeyMode || 'account'; refreshPage(); return;
    case 'set-sankey-mode': ui.sankeyMode = d.value; refreshPage(); return;
    case 'select-rebalance-scheme': ui.rebalanceSchemeId = d.id; refreshPage(); return;
    case 'toggle-rebalance-scheme': toggleRebalanceScheme(d.scheme); return;
    case 'select-calendar-scheme': ui.calendarSchemeId = d.id; ui.calendarGroupId = 'all'; refreshPage(); return;
    case 'select-calendar-group': ui.calendarGroupId = d.id; refreshPage(); return;
    case 'set-calendar-mode':
      ui.calendarMode = d.value;
      if (d.value === 'month') ui.calendarYear = parseDay(ui.calendarMonth).getFullYear();
      if (d.value === 'year') ui.calendarYear = parseDay(todayKey()).getFullYear();
      refreshPage(); return;
    case 'set-calendar-metric': ui.calendarMetric = d.value; refreshPage(); return;
    case 'cal-prev': shiftCalendar(-1); return;
    case 'cal-next': shiftCalendar(1); return;
    case 'calendar-today':
      ui.calendarMonth = startOfMonth(todayKey());
      ui.calendarYear = parseDay(todayKey()).getFullYear();
      refreshPage(); return;
    case 'open-calendar-day': openCalendarDaySheet(d.date); return;
    case 'open-calendar-week':
      ui.calendarMonth = startOfMonth(d.start);
      ui.calendarMode = 'day';
      refreshPage(); return;
    case 'open-calendar-month':
      ui.calendarMonth = d.month;
      ui.calendarMode = 'day';
      refreshPage(); return;
    case 'open-calendar-year':
      ui.calendarYear = Number(d.year);
      ui.calendarMode = 'month';
      refreshPage(); return;

    case 'new-scheme': closeAllSheets(); setTimeout(openNewSchemeSheet, 50); return;
    case 'edit-scheme': closeAllSheets(); setTimeout(() => openEditSchemeSheet(d.scheme), 50); return;
    case 'delete-scheme': closeAllSheets(); setTimeout(() => deleteSchemeById(d.scheme), 50); return;
    case 'open-group-editor': closeAllSheets(); setTimeout(() => openGroupEditor(d.scheme, d.id || null), 50); return;
    case 'open-type-editor': closeAllSheets(); setTimeout(() => openTypeEditor(d.kind, d.id || ''), 50); return;
    case 'move-group': moveGroup(d.id, Number(d.dir)); return;
    case 'open-group-detail': openGroupDetailSheet(d.id); return;
    case 'open-target-editor': closeAllSheets(); setTimeout(() => openTargetEditor(d.scheme), 60); return;
    case 'open-rebalance-plan': openRebalancePlanSheet(d.scheme); return;

    case 'open-base-currency': openBaseCurrencySheet(); return;
    case 'open-rates': openRatesSheet(); return;
    case 'open-tolerance': openToleranceSheet(); return;
    case 'export-data': downloadBackup(); return;
    case 'import-data': triggerImport(); return;
    case 'reset-demo': closeAllSheets(); setTimeout(resetDemo, 50); return;
    case 'switch-demo': closeAllSheets(); setTimeout(() => switchDataMode(true), 50); return;
    case 'switch-user': closeAllSheets(); setTimeout(() => switchDataMode(false), 50); return;
    case 'clear-data': closeAllSheets(); setTimeout(clearAllData, 50); return;
    default: return;
  }
}

function shiftCalendar(dir) {
  const mode = ui.calendarMode || 'day';
  const currentYear = parseDay(todayKey()).getFullYear();
  if (mode === 'day' || mode === 'week') {
    const next = addMonths(ui.calendarMonth, dir);
    if (startOfMonth(next) > startOfMonth(todayKey())) return;
    ui.calendarMonth = next;
    ui.calendarYear = parseDay(ui.calendarMonth).getFullYear();
  } else if (mode === 'month') {
    const nextYear = (Number(ui.calendarYear) || currentYear) + dir;
    if (nextYear > currentYear) return;
    ui.calendarYear = nextYear;
    ui.calendarMonth = ui.calendarYear + '-01-01';
  }
  refreshPage();
}

function moveGroup(groupId, dir) {
  const route = parseRoute();
  const schemeId = route.name === 'groups' ? route.schemeId : rebalanceSchemeId();
  const scheme = schemeById(schemeId);
  if (!scheme) return;
  const idx = scheme.groups.findIndex(g => g.id === groupId);
  const target = idx + dir;
  if (idx < 0 || target < 0 || target >= scheme.groups.length) return;
  const tmp = scheme.groups[idx];
  scheme.groups[idx] = scheme.groups[target];
  scheme.groups[target] = tmp;
  saveState(); refreshPage();
}

function deleteSchemeById(schemeId) {
  if (customSchemes().length <= 1) { toast('至少保留一个自定义分组方式', 'error'); return; }
  const scheme = schemeById(schemeId);
  if (!scheme || isBuiltinScheme(scheme)) return;
  confirmDialog({
    title: '删除「' + scheme.name + '」？', message: '这个分组方式及其所有目标设置会被删除，账户和交易记录不受影响。', confirmText: '删除', danger: true,
    onConfirm: () => {
      state.schemes = state.schemes.filter(s => s.id !== schemeId);
      const first = state.schemes[0] ? state.schemes[0].id : '__auto_account';
      if (ui.statsSchemeId === schemeId) ui.statsSchemeId = first;
      if (ui.rebalanceSchemeId === schemeId) ui.rebalanceSchemeId = first;
      if (ui.calendarSchemeId === schemeId) ui.calendarSchemeId = first;
      saveState(); closeAllSheets(); toast('分组方式已删除');
      navigate('#/settings', true); renderPage();
    }
  });
}

/* ---------- global bindings ---------- */
function bindGlobalEvents() {
  document.addEventListener('click', e => {
    const closeBtn = e.target.closest('[data-sheet-close]');
    if (closeBtn) { e.preventDefault(); closeTopSheet(); return; }
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.getAttribute('data-action');
    if (!action) return;
    // 允许普通链接继续导航
    if (el.tagName === 'A' && el.getAttribute('href') && action !== 'go') return;
    e.preventDefault();
    e.stopPropagation();
    handleAction(action, el);
  }, false);

  document.addEventListener('change', e => {
    if (e.target && e.target.id === 'import-file') {
      const f = e.target.files && e.target.files[0];
      handleImportFile(f);
      e.target.value = '';
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeTopSheet();
  });

  window.addEventListener('hashchange', () => {
    closeAllSheets();
    renderPage();
    window.scrollTo(0, 0);
  });
}

window.addEventListener('error', function (e) {
  console.error('有余运行错误', e.error || e.message);
});


/* =========================================================
   14 · 启动
   ========================================================= */
let afterRenderHooks = [];

function afterRenderPage(route) {
  // 为页面上的隐藏文件输入等预留钩子
  afterRenderHooks.forEach(fn => { try { fn(route); } catch (e) { console.error(e); } });
  // 表单里的回车不提交页面
  const screen = $('#screen');
  if (screen) {
    screen.querySelectorAll('form').forEach(form => {
      form.addEventListener('keydown', e => {
        if (e.key === 'Enter' && e.target && e.target.tagName !== 'TEXTAREA') e.preventDefault();
      });
    });
  }
}

function boot() {
  try {
    loadState();
applyTheme();
  } catch (e) {
    console.error(e);
    state = buildSeed();
    normalizeState(state);
  }
  ui = defaultUi();
  bindGlobalEvents();
  if (!location.hash || location.hash === '#') {
    history.replaceState(null, '', '#/assets');
  } else if (!/^#\//.test(location.hash)) {
    history.replaceState(null, '', '#/assets');
  }
  const route = parseRoute();
  if (!TABS.some(t => t.key === route.name) && ['account', 'instrument', 'groups', 'types'].indexOf(route.name) < 0) {
    history.replaceState(null, '', '#/assets');
  }
  renderPage({ scroll: true });
  setTimeout(() => { autoRefreshMarketQuotes().catch(e => console.warn('自动行情失败', e)); }, 900);
  if (demoMode) setTimeout(() => { hydrateDemoLedger().catch(e => console.warn('演示数据同步失败', e)); }, 1200);
  // 开放给调试与自动化测试
  window.__YINGJI__ = {
    get state() { return state; },
    get ui() { return ui; },
    renderPage, refreshPage, saveState, buildDailyAnalytics, portfolioSummary,
    groupBreakdown, computeAccountMetrics, computeInstrumentMetrics
  };
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();

</script>
