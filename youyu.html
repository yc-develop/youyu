const MARKET_SEARCH_TYPES = '11,21,22,23,31,41,81,201,202,203';
const SGE_AU9999 = { provider: 'eastmoney', code: '118.au9999', marketType: 'SGE', label: '上金所', symbol: 'AU9999', name: '黄金9999', currency: 'CNY', cls: 'gold' };
let marketSearchSeq = 0;

function marketFundClass(name) {
  const n = String(name || '');
  if (/货币|现金|理财|余额/.test(n)) return 'moneyFund';
  if (/债|固收|稳健|短债|纯债|存单/.test(n)) return 'bondFund';
  return 'equityFund';
}
function marketMetaFromSina(fields) {
  const type = String(fields[1] || '');
  const code = String(fields[2] || '').trim();
  const qcode = String(fields[3] || '').trim();
  let name = String(fields[4] || fields[0] || '').trim();
  if (!code || !qcode || !name) return null;
  if (MARKET_SEARCH_TYPES.split(',').indexOf(type) < 0) return null;
  let quoteCode = qcode;
  let marketType = '';
  let label = '';
  let currency = 'CNY';
  let cls = 'stock';
  let symbol = code;
  if (type === '41') {
    marketType = 'US';
    label = '美股';
    currency = 'USD';
    symbol = code.toUpperCase();
    quoteCode = 'us' + code.replace(/\..*$/, '').toUpperCase();
    cls = /ETF|指数|S&P|VANGUARD|ISHARES|SPDR|INVESCO/i.test(name) ? 'etf' : 'stock';
  } else if (type === '31') {
    marketType = 'HK';
    label = '港股';
    currency = 'HKD';
    quoteCode = 'hk' + code;
    cls = /ETF|指数/i.test(name) ? 'etf' : 'stock';
  } else if (qcode.indexOf('of') === 0) {
    marketType = 'FUND';
    label = '场外基金';
    quoteCode = 'jj' + code;
    cls = marketFundClass(name);
  } else if (qcode.indexOf('sh') === 0 || qcode.indexOf('sz') === 0) {
    marketType = type === '81' ? 'BOND' : (/ETF|LOF/i.test(name) || ['22', '23', '202', '203'].indexOf(type) >= 0 ? 'ETF' : 'A');
    label = type === '81' ? '债券' : (marketType === 'ETF' ? '场内基金' : 'A股');
    if (type === '81') cls = 'bond';
    else if (marketType === 'ETF') cls = /债|国债|转债|信用债/.test(name) ? 'bondFund' : 'etf';
    else cls = 'stock';
  } else {
    return null;
  }
  if (marketType === 'A' && (/^sh000/.test(quoteCode) || /^sz399/.test(quoteCode))) return null;
  return {
    provider: 'tencent', code: quoteCode, marketType, label, symbol, name,
    currency, cls, sourceType: type
  };
}
function parseSinaSuggest(raw, query) {
  const q = String(query || '').trim().toLowerCase();
  const map = new Map();
  String(raw || '').split(';').forEach(part => {
    if (!part) return;
    const fields = part.split(',');
    const meta = marketMetaFromSina(fields);
    if (!meta) return;
    const existing = map.get(meta.code);
    if (!existing) { map.set(meta.code, meta); return; }
    const rank = q => q.indexOf('sh') === 0 || q.indexOf('sz') === 0 ? 2 : q.indexOf('of') === 0 ? 1 : 0;
    if (rank(meta.code) > rank(existing.code)) map.set(meta.code, meta);
  });
  const priority = { A: 1, FUND: 2, ETF: 3, US: 4, HK: 5, BOND: 6 };
  const score = meta => {
    if (!q) return 0;
    const name = String(meta.name || '').toLowerCase();
    const sym = String(meta.symbol || '').toLowerCase();
    let n = 0;
    if (sym === q || name === q) n += 200;
    if (sym.indexOf(q) === 0) n += 80;
    if (name.indexOf(q) === 0) n += 60;
    else if (name.indexOf(q) >= 0) n += 30;
    if (String(meta.code || '').toLowerCase().indexOf(q) >= 0) n += 20;
    return n;
  };
  return Array.from(map.values()).sort((a, b) => (score(b) - score(a)) || ((priority[a.marketType] || 9) - (priority[b.marketType] || 9))).slice(0, 10);
}
function marketSearch(query) {
  const q = String(query || '').trim();
  if (!q) return Promise.resolve([]);
  if (/au9999|黄金9999|沪金|上金所/i.test(q)) return Promise.resolve([Object.assign({}, SGE_AU9999)]);
  return new Promise((resolve, reject) => {
    const seq = ++marketSearchSeq;
    const script = document.createElement('script');
    script.charset = 'gbk';
    script.src = 'https://suggest3.sinajs.cn/suggest/type=' + MARKET_SEARCH_TYPES + '&key=' + encodeURIComponent(q) + '&_=' + Date.now();
    let settled = false;
    const cleanup = () => { try { script.remove(); } catch (e) {} };
    const finish = (fn, value) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      cleanup();
      if (seq !== marketSearchSeq) { resolve([]); return; }
      fn(value);
    };
    const timer = setTimeout(() => finish(reject, new Error('行情搜索超时')), 9000);
    script.onload = () => {
      const raw = window.suggestvalue || '';
      finish(resolve, parseSinaSuggest(raw, q));
    };
    script.onerror = () => finish(reject, new Error('行情搜索不可用'));
    document.head.appendChild(script);
  });
}
async function fetchEastmoneySgeQuote(market) {

async function fetchTencentQuote(market) {
  if (!market || !market.code) throw new Error('未绑定行情代码');
  if (market.provider === 'eastmoney' || market.marketType === 'SGE') return fetchEastmoneySgeQuote(market);
  const res = await fetch('https://qt.gtimg.cn/q=' + encodeURIComponent(market.code) + '&_=' + Date.now(), {
    cache: 'no-store',
    mode: 'cors'
  });
  if (!res.ok) throw new Error('行情请求失败');
  let text = '';
  try {
    const buffer = await res.arrayBuffer();
    text = new TextDecoder('gbk').decode(buffer);
  } catch (e) {
    text = await res.text();
  }
  const m = text.match(/="([^"]*)"/);
  if (!m) throw new Error('未找到行情数据');
  const f = m[1].split('~');
  let price = 0, time = '', changePct = 0, prevClose = 0;
  if (market.code.indexOf('jj') === 0) {
    price = Number(f[5]);
    time = f[8] || '';
    changePct = Number(f[7]) || 0;
  } else {
    price = Number(f[3]);
    prevClose = Number(f[4]);
    time = f[30] || '';
    changePct = Number(f[32]) || 0;
  }
  if (!(price > 0)) throw new Error('行情价格无效');
  return { price, prevClose, changePct, time, name: f[1] || market.name, currency: market.currency };
}
function normalizeMarketTime(t) {
  const s = String(t || '').trim();
  if (/^\d{14}$/.test(s)) return s.slice(0, 4) + '-' + s.slice(4, 6) + '-' + s.slice(6, 8) + ' ' + s.slice(8, 10) + ':' + s.slice(10, 12);
  return s;
}
function quoteDateFrom(time) {
  const s = normalizeMarketTime(time);
  const m = s.match(/^(\d{4}-\d{2}-\d{2})/);
  if (!m) return todayKey();
  return m[1] > todayKey() ? todayKey() : m[1];
}
async function refreshQuoteForInstrument(id, opts) {
  const o = opts || {};
  const found = instrumentById(id);
  if (!found) return false;
  const market = found.market;
  if (!market || !market.code) { if (!o.silent) toast('该标的还没有绑定行情代码', 'error'); return false; }
  if (!o.silent) toast('正在同步行情…');
  try {
    const quote = await fetchTencentQuote(market);
    const account = accountById(found.accountId);
    const actual = account ? account.instruments.find(x => x.id === id) : null;
    if (!actual) return false;
    const date = quoteDateFrom(quote.time);
    upsertPricePoint(id, date, quote.price, 'market');
    actual.market = Object.assign({}, actual.market, {
      lastPrice: quote.price,
      lastUpdated: normalizeMarketTime(quote.time),
      lastQuoteDate: date,
      changePct: quote.changePct
    });
    saveState();
    if (!o.silent) {
      toast('行情已更新 ' + fmtPrice(quote.price, actual.currency), 'success');
      refreshPage();
      if (!actual.market.historyLoaded) setTimeout(() => ensureInstrumentHistory(id), 120);
    }
    return true;
  } catch (e) {
    console.warn('行情同步失败', e);
    if (!o.silent) toast('行情获取失败，请稍后再试', 'error');
    return false;
  }
}
async function autoRefreshMarketQuotes() {
  if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
  const last = Date.parse((state.meta && state.meta.marketSyncedAt) || '');
  if (Number.isFinite(last) && Date.now() - last < 30 * 60 * 1000) return;
  const list = [];
  accounts().forEach(a => (a.instruments || []).forEach(i => { if (i.market && i.market.code) list.push(i.id); }));
  if (!list.length) return;
  let changed = false;
  for (const id of list) {
    const ok = await refreshQuoteForInstrument(id, { silent: true });
    changed = changed || ok;
    await new Promise(resolve => setTimeout(resolve, 220));
  }
  state.meta = state.meta || {};
  state.meta.marketSyncedAt = nowISO();
  saveState();
  if (changed && !document.querySelector('.overlay')) refreshPage();
}

  return rows.map(row => [row[0], Number(row[2])]).filter(x => x[0] && x[1] > 0);

async function ensureInstrumentHistory(id, opts) {
  const o = opts || {};
  const found = instrumentById(id);
  if (!found || !found.market || !found.market.code) return false;
  const actual = (accountById(found.accountId) || { instruments: [] }).instruments.find(x => x.id === id);
  if (actual && actual.market && actual.market.marketType === 'SGE' && actual.market.historyVersion !== 2) {
    actual.market.historyLoaded = false;
    state.prices[id] = (state.prices[id] || []).filter(p => p[2] !== 'market');
  }
  if (!actual || actual.market.historyLoaded || historyLoadingIds.has(id)) return !!(actual && actual.market.historyLoaded);
  historyLoadingIds.add(id);
  try {
    let rows = [];
    const code = actual.market.code;
    if (actual.market.provider === 'eastmoney' || actual.market.marketType === 'SGE') rows = await fetchEastmoneySgeHistory(actual.market);
    else if (code.indexOf('jj') === 0) rows = await fetchFundHistory(actual.market);
    else if (code.indexOf('us') === 0) rows = await fetchSinaUSHistory(actual.market);
    else if (/^(sh|sz)/.test(code)) {
      try { rows = await fetchSinaCNHistory(actual.market); } catch (e) { rows = await fetchTencentHistory(actual.market); }
    } else rows = await fetchTencentHistory(actual.market);
    rows = rows.filter(x => x[0] <= todayKey()).slice(-2000);
    if (!rows.length) throw new Error('没有历史行情');
    rows.forEach(([date, price]) => upsertPricePoint(id, date, price, 'market'));
    actual.market = Object.assign({}, actual.market, {
      historyLoaded: true,
      historyVersion: actual.market.marketType === 'SGE' ? 2 : actual.market.historyVersion,
      historySyncedAt: nowISO(),
      historyCount: rows.length
    });
    historyLoadingIds.delete(id);
    saveState();
    if (!o.noRefresh && parseRoute().name === 'instrument' && parseRoute().id === id && !document.querySelector('.overlay')) refreshPage();
    return true;
  } catch (e) {
    historyLoadingIds.delete(id);
    console.warn('历史行情获取失败', id, e);
    return false;
  }
}

async function hydrateDemoLedger() {
  if (!demoMode || !state || !state.meta || state.meta.demoHydrated) return;
  const targetState = state;
  const list = [];
  accounts().forEach(a => (a.instruments || []).forEach(i => { if (i.market && i.market.code) list.push(i.id); }));
  if (!list.length) { state.meta.demoHydrated = true; saveState(true); return; }
  let all = true;
  for (const id of list) {
    if (state !== targetState || !demoMode) return;
    const ok = await ensureInstrumentHistory(id, { noRefresh: true });
    all = all && ok;
    await new Promise(resolve => setTimeout(resolve, 180));
  }
  if (state !== targetState || !demoMode) return;
  const closeAt = (id, date) => {
    const pts = (state.prices[id] || []).filter(p => p[2] === 'market' && p[0] <= date);
    return pts.length ? Number(pts[pts.length - 1][1]) : null;
  };
  state.records.forEach(rec => {
    if (!rec.instrumentId || (rec.type !== 'buy' && rec.type !== 'sell' && rec.type !== 'price')) return;
    const inst = instrumentById(rec.instrumentId);
    if (!inst || !inst.market) return;
    const price = closeAt(rec.instrumentId, rec.date);
    if (!(price > 0)) return;
    if (rec.type === 'price') { rec.price = price; return; }
    rec.price = price;
    rec.amount = round((Number(rec.qty) || 0) * price, 2);
    rec.fee = inst.cls === 'stock' || inst.cls === 'etf' ? Math.max(1, round(rec.amount * 0.0004, 2)) : 0;
  });
  accounts().forEach(account => {
    const recs = state.records.filter(r => r.accountId === account.id);
    const spec = SEED_SPECS[account.id];
    if (!spec) return;
    let buyCost = 0, sellProceeds = 0, income = 0, otherDep = 0, withdrawals = 0;
    recs.forEach(r => {
      if (r.type === 'buy') buyCost += (Number(r.amount) || 0) + (Number(r.fee) || 0);
      else if (r.type === 'sell') sellProceeds += (Number(r.amount) || 0) - (Number(r.fee) || 0);
      else if (r.type === 'dividend' || r.type === 'interest') income += Number(r.amount) || 0;
      else if (r.type === 'withdraw') withdrawals += Number(r.amount) || 0;
      else if (r.type === 'deposit' && r.note !== '初始资金') otherDep += Number(r.amount) || 0;
    });
    const initial = round((Number(spec.targetCash) || 0) - otherDep + withdrawals + buyCost - sellProceeds - income, 2);
    const initialRec = recs.find(r => r.type === 'deposit' && r.note === '初始资金') || recs.find(r => r.type === 'deposit' && r.date === seedDate(-496));
    if (initialRec) initialRec.amount = Math.max(0, initial);
  });
  state.meta.demoHydrated = true;
  state.meta.demoHydratedAt = nowISO();
  saveState(true);
  if (!document.querySelector('.overlay') && demoMode) refreshPage();
}

async function ensureAccountHistories(accountId) {
  const account = accountById(accountId);
  if (!account) return;
  const pending = (account.instruments || []).filter(i => i.market && i.market.code && !i.market.historyLoaded).map(i => i.id);
  if (!pending.length) return;
  for (const id of pending) {
    const route = parseRoute();
    if (route.name !== 'account' || route.id !== accountId) return;
    await ensureInstrumentHistory(id, { noRefresh: true });
  }
  const route = parseRoute();
  if (route.name === 'account' && route.id === accountId && !document.querySelector('.overlay')) refreshPage();
}

  return '<div class="import-list">' + list.map((d, i) => '<div class="import-row ' + (d.error ? 'bad' : '') + '"><input type="checkbox" data-import-index="' + i + '" ' + (d.checked && !d.error ? 'checked' : '') + ' ' + (d.error ? 'disabled' : '') + '><div class="import-main"><b>' + esc(d.date) + ' · ' + esc(importTypeLabel(d.type)) + (accountById(d.accountId) ? ' · ' + esc(accountById(d.accountId).name) : '') + (instrumentById(d.instrumentId) ? ' · ' + instrumentById(d.instrumentId).name : (d.newInstrumentName ? ' · 新标的 · ' + esc(d.newInstrumentName) : '')) + '</b><small>' + (d.qty ? esc(fmtQty(d.qty)) + ' · ' : '') + (d.price ? esc(fmtPrice(d.price)) + ' · ' : '') + esc(d.note || '') + '</small>' + (d.fee ? '<small>手续费 ' + esc(fmtMoney(d.fee, { currency: currency || 'CNY' })) + '</small>' : '') + (d.error ? '<em>' + esc(d.error) + '</em>' : '') + '</div><span class="import-amt">' + fmtMoney(d.amount || 0, { compact: true, currency: currency || 'CNY' }) + '</span></div>').join('') + '</div>';
}
function importTypeLabel(t) { return { deposit: '存入', withdraw: '取出', interest: '利息', fee: '费用', cashProfit: '更新收益', buy: '买入', sell: '卖出', dividend: '分红' }[t] || t; }
function confirmImport() {
  const valid = importDrafts.filter(d => d.checked && !d.error);
  if (!valid.length) { toast('没有可导入的记录', 'error'); return; }
  const fallbackAccount = accountById(importAccountId);
  if (!fallbackAccount) return;
  const now = Date.now();
  const colors = ['#ff9f45', '#5b8cff', '#b18cff', '#43d6b0', '#f2c45c', '#ff7aa2', '#7c9cff', '#ff5d6c'];
  valid.forEach((d, i) => {
    const account = accountById(d.accountId) || fallbackAccount;
    let inst = d.instrumentId ? instrumentById(d.instrumentId) : null;
    if (!inst && d.newInstrumentName) {
      inst = (account.instruments || []).find(x => String(x.name).trim() === String(d.newInstrumentName).trim()) || null;
      if (!inst) {
        const cls = inferImportInstrumentClass(d.newInstrumentName);
        const color = colors[account.instruments.length % colors.length];
        inst = {
          id: uid('inst'), accountId: account.id, name: d.newInstrumentName, symbol: d.newInstrumentName.slice(0, 20),
          cls, currency: account.currency, color, color2: shadeColor(color, -18), note: '截图导入自动创建'
        };
        account.instruments.push(inst);
        state.prices[inst.id] = [];
      }
      if (inst && d.price > 0) upsertPricePoint(inst.id, d.date, d.price);
      d.instrumentId = inst ? inst.id : '';
    }
    const rec = {
      id: uid('rec'), date: d.date, type: d.type, accountId: account.id,
      instrumentId: inst ? inst.id : null, amount: round(d.amount, 2), qty: normalizeFundQty(d.qty || 0, inst ? inst.cls : ''),
      price: d.price || 0, fee: d.fee || 0, fxRate: fxAt(account.currency, d.date),
      note: d.note || '截图导入', createdAt: new Date(now + i * 1000).toISOString()
    };
    state.records.push(rec);
  });
  saveState();
  toast('已导入 ' + valid.length + ' 条记录', 'success');
  navigate('#/account/' + encodeURIComponent(valid[0].accountId || fallbackAccount.id));
}


/* =========================================================
   13 · 全局交互 / 动作路由
   ========================================================= */
function defaultUi() {
  const custom = schemesForRebalance();
  const firstCustom = custom[0] ? custom[0].id : '';
  const secondCustom = custom[1] ? custom[1].id : firstCustom;
  return {
    accountPeriod: 90,
    accountChartMode: 'value',
    instrumentPeriod: 365,
    instrumentChartMode: 'price',
    recordAmountMode: 'delta',
    trendPeriod: 365,
    trendMetric: 'amount',
    flowAccountPeriod: {},
    flowInstrumentPeriod: {},
    statsSchemeId: '__auto_account',
    rebalanceSchemeId: secondCustom,
    calendarSchemeId: '__auto_account',
    calendarGroupId: 'all',
    calendarMode: 'day',
    calendarMetric: 'amount',
    calendarMonth: startOfMonth(todayKey()),
    calendarYear: parseDay(todayKey()).getFullYear(),
    sankeyMode: 'account'
  };
}

function handleAction(action, el) {
  const d = el.dataset || {};
  switch (action) {
    case 'back': goBack(d.fallback || '#/assets'); return;
    case 'go': closeAllSheets(); navigate(d.href || '#/assets'); return;
    case 'noop': return;
    case 'toggle-hide':
      state.settings.hideAmounts = !state.settings.hideAmounts;
      saveState(); refreshPage(); return;
    case 'toggle-theme': state.settings.theme = state.settings.theme === 'light' ? 'dark' : 'light'; try { localStorage.setItem(THEME_KEY, state.settings.theme); } catch (e) {} applyTheme(); saveState(); refreshPage(); toast(state.settings.theme === 'light' ? '已切换到日间模式' : '已切换到夜间模式', 'success'); return;
    case 'toggle-fx':
      state.settings.considerFx = !state.settings.considerFx;
      saveState();
      toast(state.settings.considerFx ? '已计入汇率影响' : '已按本币价格统计', 'success');
      refreshPage(); return;

    case 'open-add-account':
      closeAllSheets(); setTimeout(() => openAccountForm(), 50); return;
    case 'open-add-instrument':
      closeAllSheets(); setTimeout(() => openInstrumentForm(d.account), 50); return;
    case 'open-record-picker':
      closeAllSheets(); setTimeout(openRecordPicker, 50); return;
    case 'add-record-account':
      closeAllSheets(); setTimeout(() => openRecordChooser(d.account), 50); return;
    case 'add-record-instrument': {
      const im = instrumentById(d.instrument);
      if (!im) return;
      closeAllSheets(); setTimeout(() => openRecordChooser(im.account.id, im.id), 50); return;
    }
    case 'open-price-update': {
      const im = instrumentById(d.instrument);
      if (!im) return;
      closeAllSheets(); setTimeout(() => openRecordForm(im.account.id, 'price', im.id), 50); return;
    }
    case 'open-account-menu':
      closeAllSheets(); setTimeout(() => openAccountMenu(d.id), 50); return;
    case 'open-instrument-menu':
      closeAllSheets(); setTimeout(() => openInstrumentMenu(d.id), 50); return;
    case 'refresh-quote':
      closeAllSheets(); setTimeout(() => refreshQuoteForInstrument(d.id), 50); return;
    case 'match-market': {
      const im = instrumentById(d.id);
      if (!im) return;
      closeAllSheets(); setTimeout(() => openInstrumentForm(im.account.id, im.id), 50); return;
    }
    case 'edit-account':
      closeAllSheets(); setTimeout(() => openAccountForm(d.id), 50); return;
    case 'edit-instrument': {
      const im = instrumentById(d.id);
      if (!im) return;
      closeAllSheets(); setTimeout(() => openInstrumentForm(im.account.id, im.id), 50); return;
    }
    case 'open-records':
      closeAllSheets(); setTimeout(() => openRecordsSheet(d.scope, d.id), 50); return;
    case 'delete-account':
      setTimeout(() => deleteAccountById(d.id), 50); return;
    case 'delete-instrument':
      setTimeout(() => deleteInstrumentById(d.id), 50); return;
    case 'edit-record': {
      const rec = state.records.find(r => r.id === d.id);
      if (!rec) return;
      if (rec.type === 'flow') {
        closeAllSheets();
        const scope = rec.instrumentId ? 'instrument' : 'account';
        const targetId = rec.instrumentId || rec.accountId;
        setTimeout(() => openFlowFieldEditor(scope, targetId, rec.periodKey, rec.flowField), 50);
        return;
      }
      closeAllSheets();
      setTimeout(() => openRecordForm(rec.accountId, rec.type, rec.instrumentId, rec.id), 50);
      return;
    }
    case 'delete-record': {
      const rec = state.records.find(r => r.id === d.id);
      if (!rec) return;
      setTimeout(() => confirmDialog({
        title: '删除这条记录？', message: dateRangeLabel(rec.date, rec.date) + ' · ' + recordTitle(rec) + '。删除后相关统计会重新计算。', confirmText: '删除', danger: true,
        onConfirm: () => { deleteRecord(rec.id); closeAllSheets(); toast('记录已删除'); refreshPage(); }
      }), 80);
      return;
    }

    case 'set-account-period': ui.accountPeriod = Number(d.value); refreshPage(); return;
    case 'set-account-chart-mode': ui.accountChartMode = d.value; refreshPage(); return;
    case 'set-instrument-period': ui.instrumentPeriod = Number(d.value); refreshPage(); return;
    case 'set-instrument-chart-mode': ui.instrumentChartMode = d.value; refreshPage(); return;
    case 'set-trend-period': ui.trendPeriod = Number(d.value); refreshPage(); return;
    case 'set-trend-metric': ui.trendMetric = d.value === 'percent' ? 'percent' : 'amount'; refreshPage(); return;
    case 'set-flow-period': {
      const map = d.scope === 'account' ? (ui.flowAccountPeriod || (ui.flowAccountPeriod = {})) : (ui.flowInstrumentPeriod || (ui.flowInstrumentPeriod = {}));
      map[d.id] = d.period;
      refreshPage(); return;
    }
    case 'edit-flow-field': openFlowFieldEditor(d.scope, d.id, d.period, d.field); return;
    case 'reset-flow': resetFlowAdjustments(d.scope, d.id, d.period); return;
    case 'select-stats-scheme': ui.statsSchemeId = d.id; ui.sankeyMode = ui.sankeyMode || 'account'; refreshPage(); return;
    case 'set-sankey-mode': ui.sankeyMode = d.value; refreshPage(); return;
    case 'select-rebalance-scheme': ui.rebalanceSchemeId = d.id; refreshPage(); return;
    case 'toggle-rebalance-scheme': toggleRebalanceScheme(d.scheme); return;
    case 'select-calendar-scheme': ui.calendarSchemeId = d.id; ui.calendarGroupId = 'all'; refreshPage(); return;
    case 'select-calendar-group': ui.calendarGroupId = d.id; refreshPage(); return;
    case 'set-calendar-mode':
      ui.calendarMode = d.value;
      if (d.value === 'month') ui.calendarYear = parseDay(ui.calendarMonth).getFullYear();
      if (d.value === 'year') ui.calendarYear = parseDay(todayKey()).getFullYear();
      refreshPage(); return;
    case 'set-calendar-metric': ui.calendarMetric = d.value; refreshPage(); return;
    case 'cal-prev': shiftCalendar(-1); return;
    case 'cal-next': shiftCalendar(1); return;
    case 'calendar-today':
      ui.calendarMonth = startOfMonth(todayKey());
      ui.calendarYear = parseDay(todayKey()).getFullYear();
      refreshPage(); return;
    case 'open-calendar-day': openCalendarDaySheet(d.date); return;
    case 'open-calendar-week':
      ui.calendarMonth = startOfMonth(d.start);
      ui.calendarMode = 'day';
      refreshPage(); return;
    case 'open-calendar-month':
      ui.calendarMonth = d.month;
      ui.calendarMode = 'day';
      refreshPage(); return;
    case 'open-calendar-year':
      ui.calendarYear = Number(d.year);
      ui.calendarMode = 'month';
      refreshPage(); return;

    case 'new-scheme': closeAllSheets(); setTimeout(openNewSchemeSheet, 50); return;
    case 'edit-scheme': closeAllSheets(); setTimeout(() => openEditSchemeSheet(d.scheme), 50); return;
    case 'delete-scheme': closeAllSheets(); setTimeout(() => deleteSchemeById(d.scheme), 50); return;
    case 'open-group-editor': closeAllSheets(); setTimeout(() => openGroupEditor(d.scheme, d.id || null), 50); return;
    case 'open-type-editor': closeAllSheets(); setTimeout(() => openTypeEditor(d.kind, d.id || ''), 50); return;
    case 'move-group': moveGroup(d.id, Number(d.dir)); return;
    case 'open-group-detail': openGroupDetailSheet(d.id); return;
    case 'open-target-editor': closeAllSheets(); setTimeout(() => openTargetEditor(d.scheme), 60); return;
    case 'open-rebalance-plan': openRebalancePlanSheet(d.scheme); return;

    case 'open-base-currency': openBaseCurrencySheet(); return;
    case 'open-rates': openRatesSheet(); return;
    case 'open-tolerance': openToleranceSheet(); return;
    case 'export-data': downloadBackup(); return;
    case 'import-data': triggerImport(); return;
    case 'reset-demo': closeAllSheets(); setTimeout(resetDemo, 50); return;
    case 'switch-demo': closeAllSheets(); setTimeout(() => switchDataMode(true), 50); return;
    case 'switch-user': closeAllSheets(); setTimeout(() => switchDataMode(false), 50); return;
    case 'clear-data': closeAllSheets(); setTimeout(clearAllData, 50); return;
    default: return;
  }
}

function shiftCalendar(dir) {
  const mode = ui.calendarMode || 'day';
  const currentYear = parseDay(todayKey()).getFullYear();
  if (mode === 'day' || mode === 'week') {
    const next = addMonths(ui.calendarMonth, dir);
    if (startOfMonth(next) > startOfMonth(todayKey())) return;
    ui.calendarMonth = next;
    ui.calendarYear = parseDay(ui.calendarMonth).getFullYear();
  } else if (mode === 'month') {
    const nextYear = (Number(ui.calendarYear) || currentYear) + dir;
    if (nextYear > currentYear) return;
    ui.calendarYear = nextYear;
    ui.calendarMonth = ui.calendarYear + '-01-01';
  }
  refreshPage();
}

function moveGroup(groupId, dir) {
  const route = parseRoute();
  const schemeId = route.name === 'groups' ? route.schemeId : rebalanceSchemeId();
  const scheme = schemeById(schemeId);
  if (!scheme) return;
  const idx = scheme.groups.findIndex(g => g.id === groupId);
  const target = idx + dir;
  if (idx < 0 || target < 0 || target >= scheme.groups.length) return;
  const tmp = scheme.groups[idx];
  scheme.groups[idx] = scheme.groups[target];
  scheme.groups[target] = tmp;
  saveState(); refreshPage();
}

function deleteSchemeById(schemeId) {
  if (customSchemes().length <= 1) { toast('至少保留一个自定义分组方式', 'error'); return; }
  const scheme = schemeById(schemeId);
  if (!scheme || isBuiltinScheme(scheme)) return;
  confirmDialog({
    title: '删除「' + scheme.name + '」？', message: '这个分组方式及其所有目标设置会被删除，账户和交易记录不受影响。', confirmText: '删除', danger: true,
    onConfirm: () => {
      state.schemes = state.schemes.filter(s => s.id !== schemeId);
      const first = state.schemes[0] ? state.schemes[0].id : '__auto_account';
      if (ui.statsSchemeId === schemeId) ui.statsSchemeId = first;
      if (ui.rebalanceSchemeId === schemeId) ui.rebalanceSchemeId = first;
      if (ui.calendarSchemeId === schemeId) ui.calendarSchemeId = first;
      saveState(); closeAllSheets(); toast('分组方式已删除');
      navigate('#/settings', true); renderPage();
    }
  });
}

/* ---------- global bindings ---------- */
function bindGlobalEvents() {
  document.addEventListener('click', e => {
    const closeBtn = e.target.closest('[data-sheet-close]');
    if (closeBtn) { e.preventDefault(); closeTopSheet(); return; }
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.getAttribute('data-action');
    if (!action) return;
    // 允许普通链接继续导航
    if (el.tagName === 'A' && el.getAttribute('href') && action !== 'go') return;
    e.preventDefault();
    e.stopPropagation();
    handleAction(action, el);
  }, false);

  document.addEventListener('change', e => {
    if (e.target && e.target.id === 'import-file') {
      const f = e.target.files && e.target.files[0];
      handleImportFile(f);
      e.target.value = '';
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeTopSheet();
  });

  window.addEventListener('hashchange', () => {
    closeAllSheets();
    renderPage();
    window.scrollTo(0, 0);
  });
}

window.addEventListener('error', function (e) {
  console.error('有余运行错误', e.error || e.message);
});


/* =========================================================
   14 · 启动
   ========================================================= */
let afterRenderHooks = [];

function afterRenderPage(route) {
  // 为页面上的隐藏文件输入等预留钩子
  afterRenderHooks.forEach(fn => { try { fn(route); } catch (e) { console.error(e); } });
  // 表单里的回车不提交页面
  const screen = $('#screen');
  if (screen) {
    screen.querySelectorAll('form').forEach(form => {
      form.addEventListener('keydown', e => {
        if (e.key === 'Enter' && e.target && e.target.tagName !== 'TEXTAREA') e.preventDefault();
      });
    });
  }
}

function boot() {
  try {
    loadState();
applyTheme();
  } catch (e) {
    console.error(e);
    state = buildSeed();
    normalizeState(state);
  }
  ui = defaultUi();
  bindGlobalEvents();
  if (!location.hash || location.hash === '#') {
    history.replaceState(null, '', '#/assets');
  } else if (!/^#\//.test(location.hash)) {
    history.replaceState(null, '', '#/assets');
  }
  const route = parseRoute();
  if (!TABS.some(t => t.key === route.name) && ['account', 'instrument', 'groups', 'types', 'import'].indexOf(route.name) < 0) {
    history.replaceState(null, '', '#/assets');
  }
  renderPage({ scroll: true });
  setTimeout(() => { autoRefreshMarketQuotes().catch(e => console.warn('自动行情失败', e)); }, 900);
  if (demoMode) setTimeout(() => { hydrateDemoLedger().catch(e => console.warn('演示数据同步失败', e)); }, 1200);
  // 开放给调试与自动化测试
  window.__YINGJI__ = {
    get state() { return state; },
    get ui() { return ui; },
    renderPage, refreshPage, saveState, buildDailyAnalytics, portfolioSummary,
    groupBreakdown, computeAccountMetrics, computeInstrumentMetrics
  };
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();

</script>
