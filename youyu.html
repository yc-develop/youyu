function seedDate(offset) { return addDays(todayKey(), offset); }

function makePriceSeries(spec, days) {
  const n = days || 501;
  const rng = makeRng((spec.current * 1000 + spec.vol * 100000 + spec.startFactor * 10000) | 0);
  let values = [1];
  if (spec.kind === 'deposit') {
    const start = spec.current * spec.startFactor;
    for (let i = 1; i < n; i++) values.push(start + (spec.current - start) * (i / (n - 1)));
  } else {
    for (let i = 1; i < n; i++) {
      const shock = gaussian(rng);
      let r = spec.drift + spec.vol * shock;
      if (r < -0.09) r = -0.09;
      if (r > 0.09) r = 0.09;
      values.push(values[i - 1] * (1 + r));
    }
    const scale = spec.current / values[n - 1];
    values = values.map(v => v * scale);
  }
  const start = seedDate(-(n - 1));
  const out = [];
  for (let i = 0; i < n; i++) {
    const key = addDays(start, i);
    const wd = parseDay(key).getDay();
    let v = values[i];
    if (spec.kind === 'stock' && (wd === 0 || wd === 6) && i > 0 && i < n - 1) v = out[i - 1][1];
    if (i === n - 1) v = spec.current;
    const rounded = v < 10 ? round(v, 4) : v < 1000 ? round(v, 2) : Math.round(v);
    out.push([key, rounded]);
  }
  return out;
}

function makeFxSeries(ccy, current, days) {
  const n = days || 501;
  const rng = makeRng((current * 100000 + ccy.charCodeAt(0) * 31) | 0);
  let vals = [current];
  const vol = ccy === 'JPY' ? 0.0025 : ccy === 'USDT' ? 0.0004 : 0.0018;
  for (let i = 1; i < n; i++) {
    const back = current / vals[0];
    const meanPull = (1 - back) * 0.0008;
    const r = meanPull + vol * gaussian(rng);
    vals.push(vals[i - 1] / (1 + r));
  }
  const start = seedDate(-(n - 1));
  const chronological = vals.slice().reverse();
  return chronological.map((v, i) => [addDays(start, i), round(v, ccy === 'JPY' ? 5 : 4)]);
}

function seriesPriceAt(series, key) {
  let last = null;
  for (let i = 0; i < series.length; i++) {
    if (series[i][0] <= key) last = series[i][1];
    else break;
  }
  return last == null ? (series[0] ? series[0][1] : 0) : last;
}
function seriesFxAt(series, key) {
  if (!series) return 1;
  let last = null;
  for (let i = 0; i < series.length; i++) {
    if (series[i][0] <= key) last = series[i][1];
    else break;
  }
  return last == null ? (series[0] ? series[0][1] : 1) : last;
}

function buildSeed() {
  const accounts = SEED_ACCOUNTS.map(a => Object.assign({}, a, {

    demo: true,

  }));
  const seriesPrices = {};
  Object.keys(SEED_INSTRUMENTS).forEach(accId => {
    (SEED_INSTRUMENTS[accId] || []).forEach(inst => {
      seriesPrices[inst.id] = makePriceSeries(SEED_PRICES[inst.id], 501);
    });
  });
  const fxHistory = {};
  Object.keys(SEED_RATES).forEach(ccy => {
    if (ccy === 'CNY') return;
    fxHistory[ccy] = makeFxSeries(ccy, SEED_RATES[ccy], 501);
  });
  const records = [];
  const addRecord = r => {
    records.push(Object.assign({
      id: uid('rec'),
      date: todayKey(),
      type: 'deposit',
      accountId: '',
      instrumentId: null,
      amount: 0,
      qty: 0,
      price: 0,
      fee: 0,
      fxRate: 1,
      note: '',
      createdAt: nowISO()
    }, r));
  };
  const instById = {};
  accounts.forEach(a => a.instruments.forEach(i => { instById[i.id] = { inst: i, account: a }; }));

  accounts.forEach(account => {
    const spec = SEED_SPECS[account.id] || { targetCash: 0, flows: [], buys: [], sells: [], incomes: [] };
    let buyCost = 0, sellProceeds = 0, income = 0, otherDeposits = 0, withdrawals = 0;

    (spec.flows || []).forEach(f => {
      if (f.type === 'deposit') otherDeposits += f.amount;
      if (f.type === 'withdraw') withdrawals += f.amount;
    });
    (spec.incomes || []).forEach(inc => { income += inc.amount; });

    (spec.buys || []).forEach(b => {
      const rec = instById[b.inst];
      if (!rec) return;
      const d = seedDate(b.offset);
      const price = seriesPriceAt(seriesPrices[b.inst], d);
      const amount = round(b.qty * price, 2);
      const fee = rec.inst.cls === 'stock' || rec.inst.cls === 'etf' ? Math.max(1, round(amount * 0.0004, 2)) : 0;
      buyCost += amount + fee;
      addRecord({
        date: d, type: 'buy', accountId: account.id, instrumentId: b.inst,
        amount, qty: b.qty, price, fee,
        fxRate: account.currency === 'CNY' ? 1 : seriesFxAt(fxHistory[account.currency], d),
        note: b.note || '买入'
      });
    });

    (spec.sells || []).forEach(s => {
      const rec = instById[s.inst];
      if (!rec) return;
      const d = seedDate(s.offset);
      const price = seriesPriceAt(seriesPrices[s.inst], d);
      const amount = round(s.qty * price, 2);
      const fee = rec.inst.cls === 'stock' || rec.inst.cls === 'etf' ? Math.max(1, round(amount * 0.0004, 2)) : 0;
      sellProceeds += amount - fee;
      addRecord({
        date: d, type: 'sell', accountId: account.id, instrumentId: s.inst,
        amount, qty: s.qty, price, fee,
        fxRate: account.currency === 'CNY' ? 1 : seriesFxAt(fxHistory[account.currency], d),
        note: s.note || '卖出'
      });
    });

    (spec.flows || []).forEach(f => {
      addRecord({
        date: seedDate(f.offset), type: f.type, accountId: account.id,
        amount: f.amount, note: f.note || '',
        fxRate: account.currency === 'CNY' ? 1 : seriesFxAt(fxHistory[account.currency], seedDate(f.offset))
      });
    });

    (spec.incomes || []).forEach(inc => {
      addRecord({
        date: seedDate(inc.offset), type: inc.type, accountId: account.id,
        instrumentId: inc.inst || null, amount: inc.amount, note: inc.note || '收益',
        fxRate: account.currency === 'CNY' ? 1 : seriesFxAt(fxHistory[account.currency], seedDate(inc.offset))
      });
    });

    const initial = round(spec.targetCash - otherDeposits + withdrawals + buyCost - sellProceeds - income, 2);
    addRecord({
      date: seedDate(-496), type: 'deposit', accountId: account.id,
      amount: Math.max(initial, 0), note: '初始资金',
      fxRate: account.currency === 'CNY' ? 1 : seriesFxAt(fxHistory[account.currency], seedDate(-496))
    });

    (spec.extras || []).forEach(x => {
      addRecord(Object.assign({}, x, {
        date: seedDate(x.offset), accountId: account.id,
        amount: 0,
        fxRate: x.fxRate || (account.currency === 'CNY' ? 1 : seriesFxAt(fxHistory[account.currency], seedDate(x.offset)))
      }));
    });
  });

  // 月末估值记录（用于详情页时间线）
  accounts.forEach(account => {
    account.instruments.forEach(inst => {
      const cls = inst.cls;
      const isDeposit = cls === 'deposit';
      const isMoney = cls === 'moneyFund';
      const updateOffsets = isDeposit || isMoney ? [-120, -90, -60, -30] : [-150, -90, -45, -15];
      updateOffsets.forEach(off => {
        const d = seedDate(off);
        addRecord({
          date: d, type: 'price', accountId: account.id, instrumentId: inst.id,
          price: seriesPriceAt(seriesPrices[inst.id], d),
          note: isDeposit ? '利息结转' : isMoney ? '收益结转' : '估值更新',
          fxRate: account.currency === 'CNY' ? 1 : seriesFxAt(fxHistory[account.currency], d)
        });
      });
    });
  });

  records.sort((a, b) => {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    const pri = { deposit: 0, buy: 1, sell: 2, dividend: 3, interest: 3, fee: 4, fx: 5, price: 6, withdraw: 7 };
    return (pri[a.type] || 9) - (pri[b.type] || 9);
  });

  const schemes = [
    {
      id: 'scheme_account', name: '账户归属', desc: '按资金所在账户划分',
      groups: [
        { id: 'g_domestic', name: '境内账户', color: '#ff9f45', target: 60, includeAccounts: ['alipay', 'wechat', 'cash', 'boc', 'alipayfund', 'deposit'], includeClasses: [], includeInstruments: [] },
        { id: 'g_global', name: '境外账户', color: '#5b8cff', target: 40, includeAccounts: ['longbridge', 'futu'], includeClasses: [], includeInstruments: [] }
      ]
    },
    {
      id: 'scheme_risk', name: '风险属性', desc: '按资金的风险用途划分',
      groups: [
        { id: 'g_liquid', name: '活钱', color: '#43d6b0', target: 10, includeAccounts: ['alipay', 'wechat', 'cash'], includeClasses: ['moneyFund'], includeInstruments: [] },
        { id: 'g_steady', name: '稳健投资', color: '#5b8cff', target: 38, includeAccounts: ['boc', 'deposit'], includeClasses: ['bondFund', 'bond', 'deposit'], includeInstruments: [] },
        { id: 'g_risk', name: '风险投资', color: '#ff5d6c', target: 52, includeAccounts: ['alipayfund', 'longbridge', 'futu'], includeClasses: ['stock', 'etf', 'equityFund'], includeInstruments: [] }
      ]
    }
  ];

  const storedPrices = {};
  const addPricePoint = (id, date, price) => {
    if (!id || !(Number(price) > 0)) return;
    if (!storedPrices[id]) storedPrices[id] = [];
    const idx = storedPrices[id].findIndex(([d]) => d === date);
    if (idx >= 0) storedPrices[id][idx][1] = Number(price);
    else storedPrices[id].push([date, Number(price), 'record']);
  };
  records.forEach(r => {
    if (!r.instrumentId) return;
    if (r.type === 'buy' || r.type === 'sell' || r.type === 'price') addPricePoint(r.instrumentId, r.date, r.price);
  });
  Object.keys(storedPrices).forEach(id => storedPrices[id].sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));
  return {
    version: SCHEMA,
    createdAt: nowISO(),
    isDemo: true,
    settings: {
      base: 'CNY',
      considerFx: true,
      tolerance: 3,
      hideAmounts: false,
      showWeekends: true
    },
    rates: Object.assign({}, SEED_RATES),
    accountTypes: defaultAccountTypes(),
    instrumentTypes: defaultInstrumentTypes(),
    accounts,
    records,
    prices: storedPrices,
    fxHistory,
    schemes,
    rebalance: { schemes: {}, targets: {} },
    meta: { name: '我的投资组合', lastUpdated: nowISO() }
  };
}

/* ---------- persistence ---------- */
function recordPricePoints(obj, instrumentId) {
  const map = new Map();
  (obj.records || []).forEach(r => {
    if (r.instrumentId !== instrumentId) return;
    if (r.type !== 'buy' && r.type !== 'sell' && r.type !== 'price') return;
    const price = Number(r.price) || 0;
    if (!(price > 0) || !r.date) return;
    map.set(r.date, price);
  });
  return Array.from(map.entries()).sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0).map(([d, p]) => [d, p, 'record']);
}
function rebuildRecordPrices(obj, instrumentId) {
  const target = obj || state;
  if (!target || !target.prices) return;
  let found = null;
  (target.accounts || []).forEach(a => (a.instruments || []).forEach(i => { if (i.id === instrumentId) found = i; }));
  if (!found || found.market) return;
  target.prices[instrumentId] = recordPricePoints(target, instrumentId);
}
function rebuildAllRecordPrices() {
  if (!state) return;
  (state.accounts || []).forEach(a => (a.instruments || []).forEach(i => {
    if (!i.market) rebuildRecordPrices(state, i.id);
  }));
}
function normalizeState(obj) {
  if (!obj || !Array.isArray(obj.accounts) || !Array.isArray(obj.records)) return false;
  obj.settings = obj.settings || {};
  obj.settings.base = CURRENCY_META[obj.settings.base] ? obj.settings.base : 'CNY';
  // 阶段一：统一排除汇兑损益，汇率只用于金额折算。
  obj.settings.considerFx = false;
  obj.settings.tolerance = Number.isFinite(Number(obj.settings.tolerance)) ? Number(obj.settings.tolerance) : 3;
  obj.settings.hideAmounts = !!obj.settings.hideAmounts;
  obj.settings.theme = obj.settings.theme === 'light' ? 'light' : 'dark';
  obj.accountTypes = normalizeTypeList(obj.accountTypes, DEFAULT_ACCOUNT_TYPES, 'account');
  obj.instrumentTypes = normalizeTypeList(obj.instrumentTypes, DEFAULT_INSTRUMENT_TYPES, 'instrument');
  const validAccountTypes = new Set(obj.accountTypes.map(t => t.id));
  const validInstrumentTypes = new Set(obj.instrumentTypes.map(t => t.id));
  const seedAccountIds = new Set(SEED_ACCOUNTS.map(a => a.id));
  const seedInstrumentIds = new Set(Object.keys(SEED_INSTRUMENTS).reduce((all, k) => all.concat((SEED_INSTRUMENTS[k] || []).map(i => i.id)), []));
  const accountTypeById = id => obj.accountTypes.find(t => t.id === id);
  const instrumentTypeById = id => obj.instrumentTypes.find(t => t.id === id);
  obj.rates = obj.rates || {};
  Object.keys(CURRENCY_META).forEach(ccy => {
    if (!Number.isFinite(Number(obj.rates[ccy])) || Number(obj.rates[ccy]) <= 0) obj.rates[ccy] = CURRENCY_META[ccy].defaultRate;
  });
  obj.accounts.forEach(a => {
    a.id = a.id || uid('acc');
    a.instruments = Array.isArray(a.instruments) ? a.instruments : [];
    a.currency = CURRENCY_META[a.currency] ? a.currency : 'CNY';
    if (a.demo == null) a.demo = seedAccountIds.has(a.id);
    a.type = validAccountTypes.has(a.type) ? a.type : (validAccountTypes.has('payment') ? 'payment' : obj.accountTypes[0].id);
    a.typeName = accountTypeById(a.type) ? accountTypeById(a.type).name : a.type;
    a.color = a.color || '#ff9f45';
    a.color2 = a.color2 || a.color || '#d97823';
    a.icon = a.icon || (a.name || '?').slice(0, 1);
    a.instruments.forEach(i => {
      i.id = i.id || uid('inst');
      i.accountId = a.id;
      if (i.demo == null) i.demo = seedInstrumentIds.has(i.id);
      i.currency = CURRENCY_META[i.currency] ? i.currency : a.currency;
      i.cls = validInstrumentTypes.has(i.cls) ? i.cls : (validInstrumentTypes.has('other') ? 'other' : obj.instrumentTypes[0].id);
      const typeMeta = instrumentTypeById(i.cls);
      i.color = i.color || (typeMeta ? typeMeta.color : '#8e9aaf');
      i.color2 = i.color2 || i.color;
      if (!i.market && SEED_MARKET_MAP[i.id]) i.market = JSON.parse(JSON.stringify(SEED_MARKET_MAP[i.id]));
      if (i.market) delete i.market.historyLoading;
    });
  });
  obj.records.forEach(r => {
    r.id = r.id || uid('rec');
    r.date = r.date || todayKey();
    r.type = RECORD_META[r.type] ? r.type : 'deposit';
    r.amount = Number(r.amount) || 0;
    r.qty = Number(r.qty) || 0;
    r.price = Number(r.price) || 0;
    r.fee = Number(r.fee) || 0;
    r.fxRate = Number(r.fxRate) || 0;
  });
  // 账本调整替代旧版仅报表的 flowSnapshot；旧记录不兼容，直接移除。
  obj.records = obj.records.filter(r => r.type !== 'flow' || r.ledgerAdjust);
  obj.prices = obj.prices || {};
  (obj.accounts || []).forEach(a => (a.instruments || []).forEach(i => { if (!i.market) rebuildRecordPrices(obj, i.id); }));
  obj.fxHistory = obj.fxHistory || {};
  obj.rebalance = obj.rebalance && typeof obj.rebalance === 'object' ? obj.rebalance : {};
  obj.rebalance.schemes = obj.rebalance.schemes && typeof obj.rebalance.schemes === 'object' ? obj.rebalance.schemes : {};
  obj.rebalance.targets = obj.rebalance.targets && typeof obj.rebalance.targets === 'object' ? obj.rebalance.targets : {};
  if (!Array.isArray(obj.schemes) || !obj.schemes.length) obj.schemes = buildSeed().schemes;
  obj.schemes.forEach(s => {
    s.id = s.id || uid('sch');
    s.groups = Array.isArray(s.groups) ? s.groups : [];
    s.groups.forEach((g, gi) => {
      g.id = g.id || uid('grp');
      g.name = g.name || ('分组 ' + (gi + 1));
      g.color = g.color || GROUP_COLORS[gi % GROUP_COLORS.length];
      g.target = Number.isFinite(Number(g.target)) ? Number(g.target) : 0;
      g.includeAccounts = Array.isArray(g.includeAccounts) ? g.includeAccounts : [];
      g.includeCashAccounts = Array.isArray(g.includeCashAccounts) ? g.includeCashAccounts : [];
      g.includeClasses = Array.isArray(g.includeClasses) ? g.includeClasses : [];
      g.includeInstruments = Array.isArray(g.includeInstruments) ? g.includeInstruments : [];
    });
  });
  const allInstruments = [];
  obj.accounts.forEach(a => (a.instruments || []).forEach(i => allInstruments.push(i)));
  obj.schemes.forEach(s => {
    (s.groups || []).forEach(g => {
      if (Array.isArray(g.includeClasses) && g.includeClasses.length) {
        const ids = allInstruments.filter(i => g.includeClasses.indexOf(i.cls) >= 0).map(i => i.id);
        g.includeInstruments = uniq((g.includeInstruments || []).concat(ids));
        g.includeClasses = [];
      }
    });
  });
  obj.meta = obj.meta || {};
  return true;
}

function readStoredState(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const parsed = JSON.parse(raw);

    case 'cashProfit': return Number(rec.amount) || 0;

/* ---------- instrument metrics ---------- */
function computeInstrumentMetrics(instId) {

function instrumentProfitSeries(im) {

  const recs = recordsForInstrument(inst.id)
    .filter(r => r.type === 'buy' || r.type === 'sell' || r.type === 'dividend')
    .slice()

/* ---------- cash income ---------- */
function accountIncome(account) {
  let income = 0, fees = 0;
  recordsForAccount(account.id).forEach(r => {
    const inst = r.instrumentId ? instrumentById(r.instrumentId) : null;
    const ccy = inst ? inst.currency : account.currency;
    const rate = (recordFx(r, ccy) / rateCNY(baseCurrency()));
    if (r.type === 'dividend' || r.type === 'interest' || r.type === 'cashProfit') income += (Number(r.amount) || 0) * rate;
    if (r.type === 'fee') fees += (Number(r.amount) || 0) * rate;
    if (r.type === 'buy' || r.type === 'sell') fees += (Number(r.fee) || 0) * rate * (inst && inst.currency !== account.currency ? crossRate(inst.currency, account.currency, r.date) : 1);

function accountNetDeposits(account) {

    if (r.type === 'deposit' || r.type === 'withdraw') {
      const v = recordBase(r, account.currency);
      if (r.type === 'deposit') { deposits += v; net += v; }
      else { withdrawals += v; net -= v; }
      return;
    }
    if (r.type !== 'flow' || !r.ledgerAdjust) return;
    if (r.flowField === 'in' || r.flowField === 'out') {
      const d = (Number(r.flowDeltaNative) || 0) * fxToBaseAt(account.currency, r.date);
      if (r.flowField === 'in') { deposits += d; net += d; }
      else { withdrawals += d; net -= d; }
    } else if (r.flowField === 'opening') {
      net += (Number(r.netDeltaNative) || 0) * fxToBaseAt(account.currency, r.date);
    }
  });
  return { net, deposits, withdrawals };
}

function accountNetDepositsNative(account) {
  let net = 0, deposits = 0, withdrawals = 0;
  recordsForAccount(account.id).forEach(r => {
    if (r.type === 'deposit' || r.type === 'withdraw') {
      const v = Number(r.amount) || 0;
      if (r.type === 'deposit') { deposits += v; net += v; }
      else { withdrawals += v; net -= v; }
      return;
    }
    if (r.type !== 'flow' || !r.ledgerAdjust) return;
    if (r.flowField === 'in' || r.flowField === 'out') {
      const d = Number(r.flowDeltaNative) || 0;
      if (r.flowField === 'in') { deposits += d; net += d; }
      else { withdrawals += d; net -= d; }
    } else if (r.flowField === 'opening') {
      net += Number(r.netDeltaNative) || 0;
    }
  });
  return { net, deposits, withdrawals };
}

function computeAccountMetrics(accountId) {
  if (!dataCache.accounts) dataCache.accounts = {};

  const account = accountById(accountId);
  if (!account) return null;

  const floatBase = sum(insts, x => x.pricePnl);

  const profitNative = marketNative - depositsNative.net;

  const unrealizedNative = profitNative - realizedNativeAccount;
  const out = {
    account, accountId,
    cashNative, cashBase, holdingsBase, holdingsNative, marketNative, marketBase, value: marketBase,
    netDeposits: deposits.net, deposits: deposits.deposits, withdrawals: deposits.withdrawals,
    netDepositsNative: depositsNative.net, depositsNative: depositsNative.deposits, withdrawalsNative: depositsNative.withdrawals,
    profitNative, returnPctNative: depositsNative.net > 0 ? profitNative / depositsNative.net : null,
    realizedNativeAccount, unrealizedNative,
    realizedBase, realized: realizedBase,
    floatBase, floatPnl: floatBase,
    fxPnl, profit, unrealized, unrealizedPnl: unrealized,
    profitPct: deposits.net > 0 ? profit / deposits.net : null,
    fullProfit, baseProfit,
    incomeBase: income.income, feesBase: income.fees,
    costBasis,
    instruments: insts,
    positions: insts.filter(x => x.qty > 0.0000001).length,
    recordCount: recordsForAccount(accountId).length,
    firstDate: (recordsForAccount(accountId)[0] || {}).date || null
  };
  dataCache.accounts[accountId] = out;
  return out;
}

function allAccountMetrics() { return accounts().map(a => computeAccountMetrics(a.id)).filter(Boolean); }
function portfolioSummary() {
  if (dataCache.portfolio) return dataCache.portfolio;
  const list = allAccountMetrics();
  const totalMarket = sum(list, x => x.marketBase);
  const cash = sum(list, x => x.cashBase);

  };

/* ---------- schemes / membership ---------- */
function groupMatches(group, account, inst) {
  if (!group) return false;
  if (group.typeFilter) return !!inst && inst.cls === group.typeFilter;
  if (inst) {
    if (group.cashOnly) return false;
    if ((group.includeInstruments || []).indexOf(inst.id) >= 0) return true;
    if ((group.includeAccounts || []).indexOf(account.id) >= 0) return true;
    return false;
  }
  if (group.cashOnly) return (group.includeAccounts || []).indexOf(account.id) >= 0;
  if ((group.includeAccounts || []).indexOf(account.id) >= 0) return true;
  if ((group.includeCashAccounts || []).indexOf(account.id) >= 0) return true;
  return false;
}
function resolveGroupId(scheme, account, inst) {
  if (!scheme) return null;
  for (const g of scheme.groups) {
    if (groupMatches(g, account, inst)) return g.id;
  }
  return null;
}
function groupTarget(g) { return Number(g.target) || 0; }
function schemeTargetTotal(scheme) { return sum(scheme ? scheme.groups : [], g => rebalanceTargetFor(scheme, g)); }
function normalizeTargets(scheme) {
  const total = schemeTargetTotal(scheme);
  return (scheme ? scheme.groups : []).map(g => ({
    group: g,
    raw: rebalanceTargetFor(scheme, g),
    normalized: total > 0 ? rebalanceTargetFor(scheme, g) / total : 0
  }));
}
function groupIncludeSummary(group) {
  if (group.typeFilter) return instrumentTypeName(group.typeFilter) + ' · 按标的类型';
  const names = [];
  (group.includeAccounts || []).forEach(id => { const a = accountById(id); if (a) names.push(a.name); });
  (group.includeCashAccounts || []).forEach(id => { if ((group.includeAccounts || []).indexOf(id) < 0) { const a = accountById(id); if (a) names.push(a.name + ' · 现金'); } });
  (group.includeInstruments || []).forEach(id => { const i = instrumentById(id); if (i) names.push(i.name); });
  return names.length ? names.join(' · ') : '尚未选择资产';
}

/* ---------- daily analytics ---------- */
function dailyStartDate() {
  let earliest = addDays(todayKey(), -520);
  (state.records || []).forEach(r => { if (r.date < earliest) earliest = r.date; });
  return addDays(earliest, -1);
}

function buildDailyAnalytics() {
  const consider = state.settings.considerFx;
  const base = baseCurrency();
  const key = 'daily|' + dataRev + '|' + consider + '|' + base;
  if (dataCache.daily && dataCache.dailyKey === key) return dataCache.daily;
  const start = dailyStartDate();
  const days = Math.max(2, daysBetween(start, todayKey()) + 1);
  const dates = [];
  for (let i = 0; i < days; i++) dates.push(addDays(start, i));
  const N = dates.length;
  const indexMap = new Map();
  dates.forEach((d, i) => indexMap.set(d, i));
  const baseRate = rateCNY(base);

  const recordsByDate = {};
  recordsSorted().forEach(r => {
    if (!indexMap.has(r.date)) return;
    if (!recordsByDate[r.date]) recordsByDate[r.date] = [];
    recordsByDate[r.date].push(r);
  });

  const components = [];
  const byAccount = new Map();
  const byInstrument = new Map();
  const totalValues = new Array(N).fill(0);
  const totalPnls = new Array(N).fill(0);

  accounts().forEach(account => {
    const accRecs = recordsForAccount(account.id);
    const cashValues = new Array(N).fill(0);
    const cashPnls = new Array(N).fill(0);
    const cashNativeValues = new Array(N).fill(0);
    const cashNativePnls = new Array(N).fill(0);
    const cashFxSeries = new Array(N).fill(0);
    let cash = 0;
    for (let i = 0; i < N; i++) {
      const d = dates[i];
      const prevD = addDays(d, -1);
      const cashStart = cash;
      let income = 0, fees = 0, valuation = 0;
      let nativeIncome = 0, nativeFees = 0, nativeValuation = 0;
      (recordsByDate[d] || []).forEach(r => {
        if (r.accountId !== account.id) return;
        cash += recordCashDelta(r, account);
        const inst = r.instrumentId ? instrumentById(r.instrumentId) : null;
        const ccy = inst ? inst.currency : account.currency;
        const toAcc = inst ? crossRate(inst.currency, account.currency, d) : 1;
        if (r.type === 'dividend' || r.type === 'interest' || r.type === 'cashProfit') { income += (Number(r.amount) || 0) * toAcc; nativeIncome += (Number(r.amount) || 0) * toAcc; }
        if (r.type === 'fee') { fees += (Number(r.amount) || 0); nativeFees += Number(r.amount) || 0; }
        if (r.type === 'buy' || r.type === 'sell') { fees += (Number(r.fee) || 0) * toAcc; nativeFees += (Number(r.fee) || 0) * toAcc; }
        if (r.type === 'flow' && r.ledgerAdjust && (r.flowField === 'ending' || r.flowField === 'profit')) {
          valuation += (Number(r.cashNative) || 0) * fxToBaseAt(account.currency, d);
          nativeValuation += Number(r.cashNative) || 0;
        }
      });
      const baseNow = fxAt(account.currency, d) / baseRate;
      const basePrev = fxAt(account.currency, prevD) / baseRate;
      const cashFx = consider ? cashStart * (baseNow - basePrev) : 0;
      cashValues[i] = cash * baseNow;
      cashPnls[i] = (income - fees) * baseNow + valuation + cashFx;
      cashNativeValues[i] = cash;
      cashNativePnls[i] = nativeIncome - nativeFees + nativeValuation;
      cashFxSeries[i] = cashFx;
    }
    const cashComp = {
      accountId: account.id, instrumentId: null, kind: 'cash', account,
      values: cashValues, pnls: cashPnls, nativeValues: cashNativeValues, nativePnls: cashNativePnls, cashFx: cashFxSeries
    };
    components.push(cashComp);

    const instComps = [];
    instrumentsOf(account).forEach(inst => {
      const buySellRecs = accRecs.filter(r => r.instrumentId === inst.id && (r.type === 'buy' || r.type === 'sell'));
      const events = {};
      buySellRecs.forEach(r => {
        if (!events[r.date]) events[r.date] = [];
        events[r.date].push(r);
      });
      let qty = 0;
      const vals = new Array(N).fill(0);
      const pnls = new Array(N).fill(0);
      const nativeVals = new Array(N).fill(0);
      const nativePnls = new Array(N).fill(0);
      for (let i = 0; i < N; i++) {
        const d = dates[i];
        const prevD = addDays(d, -1);
        const qtyStart = qty;
        (events[d] || []).forEach(r => {
          if (r.type === 'buy') qty += Number(r.qty) || 0;
          else if (r.type === 'sell') qty = Math.max(0, qty - (Number(r.qty) || 0));
        });
        const p = priceAt(inst.id, d);
        const pp = priceAt(inst.id, prevD);
        const fx = fxAt(inst.currency, d) / baseRate;
        const pfx = fxAt(inst.currency, prevD) / baseRate;
        const pnl = consider ? qtyStart * (p * fx - pp * pfx) : qtyStart * (p - pp) * fx;
        const cross = crossRate(inst.currency, account.currency, d);
        const crossPrev = crossRate(inst.currency, account.currency, prevD);
        vals[i] = qty * p * fx;
        pnls[i] = pnl;
        nativeVals[i] = qty * p * cross;
        nativePnls[i] = consider ? qtyStart * (p * cross - pp * crossPrev) : qtyStart * (p - pp) * cross;
      }
      const comp = {
        accountId: account.id, instrumentId: inst.id, kind: 'instrument', inst, account,
        values: vals, pnls, nativeValues: nativeVals, nativePnls: nativePnls
      };
      components.push(comp);
      instComps.push(comp);
      byInstrument.set(inst.id, { inst, account, values: vals, pnls: pnls, nativeValues: nativeVals, nativePnls: nativePnls, dates });
    });

    const accVals = new Array(N).fill(0);
    const accPnls = new Array(N).fill(0);
    const nativeValues = new Array(N).fill(0);
    const nativePnls = new Array(N).fill(0);
    for (let i = 0; i < N; i++) {
      let v = cashValues[i], p = cashPnls[i];
      instComps.forEach(c => { v += c.values[i]; p += c.pnls[i]; });
      accVals[i] = v;
      accPnls[i] = p;
      totalValues[i] += v;
      totalPnls[i] += p;
      nativeValues[i] = cashNativeValues[i];
      nativePnls[i] = cashNativePnls[i];
      instComps.forEach(c => {
        nativeValues[i] += c.nativeValues[i];
        nativePnls[i] += c.nativePnls[i];
      });
    }
    byAccount.set(account.id, { account, values: accVals, pnls: accPnls, nativeValues, nativePnls, cashValues, cashPnls, instruments: instComps, dates });
  });

  const daily = {
    dates, indexMap, n: N, components, byAccount, byInstrument,
    total: { values: totalValues, pnls: totalPnls, dates },
    consider, base
  };
  dataCache.daily = daily;
  dataCache.dailyKey = key;
  return daily;
}

/* ---------- group time series ---------- */
function groupDailySeries(schemeId) {
  const daily = buildDailyAnalytics();
  const key = 'groups|' + dataRev + '|' + schemeId + '|' + state.settings.considerFx + '|' + baseCurrency();
  if (dataCache.groupKey === key && dataCache.groups) return dataCache.groups;
  const scheme = schemeById(schemeId) || schemes()[0];
  if (!scheme) return { scheme: null, groups: [], ungrouped: null, total: daily.total, dates: daily.dates };
  const N = daily.n;
  const map = new Map();
  scheme.groups.forEach(g => {
    map.set(g.id, {
      id: g.id, name: g.name, color: g.color, target: groupTargetValue(scheme, g), group: g,
      values: new Array(N).fill(0), pnls: new Array(N).fill(0)
    });
  });
  let un = null;
  daily.components.forEach(comp => {
    const account = comp.account;
    const inst = comp.inst || null;
    const gid = resolveGroupId(scheme, account, inst);
    let target;
    if (gid && map.has(gid)) target = map.get(gid);
    else {
      if (!un) un = { id: '__ungrouped', name: '未分组', color: '#6b7280', target: 0, values: new Array(N).fill(0), pnls: new Array(N).fill(0) };
      target = un;
    }
    for (let i = 0; i < N; i++) {
      target.values[i] += comp.values[i];
      target.pnls[i] += comp.pnls[i];
    }
  });
  const groups = Array.from(map.values());
  if (un) groups.push(un);
  const out = { scheme, groups, ungrouped: un, total: daily.total, dates: daily.dates, n: N };
  dataCache.groups = out;
  dataCache.groupKey = key;
  return out;
}

/* ---------- period stats ---------- */
function sliceSeries(series, startDate, endDate) {
  const daily = buildDailyAnalytics();
  const dates = series.dates || daily.dates;
  const vals = series.values;
  const pnls = series.pnls;
  let startIdx = 0, endIdx = dates.length - 1;
  if (startDate) {
    startIdx = dates.findIndex(d => d >= startDate);
    if (startIdx < 0) startIdx = dates.length - 1;
  }
  if (endDate) {
    for (let i = dates.length - 1; i >= 0; i--) { if (dates[i] <= endDate) { endIdx = i; break; } }
  }
  if (endIdx < startIdx) endIdx = startIdx;
  const outDates = dates.slice(startIdx, endIdx + 1);
  const outVals = vals.slice(startIdx, endIdx + 1);
  const outPnls = pnls.slice(startIdx, endIdx + 1);
  return { dates: outDates, values: outVals, pnls: outPnls, startIdx, endIdx, allDates: dates };
}

function periodStats(series, startDate, endDate) {
  const s = sliceSeries(series, startDate, endDate);
  const all = series.values;
  const startIdx = s.startIdx;
  const prevVal = startIdx > 0 ? all[startIdx - 1] : 0;
  const firstVal = s.values[0] || 0;
  const endVal = s.values[s.values.length - 1] || 0;
  const pnl = sum(s.pnls);
  const baseVal = prevVal > 0 ? prevVal : firstVal;
  const returnPct = baseVal > 0 ? pnl / baseVal : (endVal - pnl > 0 ? pnl / (endVal - pnl) : 0);
  let pos = 0, neg = 0, best = null, worst = null;
  s.pnls.forEach((p, i) => {
    if (p > 0.0001) pos++;
    if (p < -0.0001) neg++;
    if (!best || p > best.pnl) best = { pnl: p, date: s.dates[i] };
    if (!worst || p < worst.pnl) worst = { pnl: p, date: s.dates[i] };
  });
  return {
    startDate: s.dates[0], endDate: s.dates[s.dates.length - 1],
    pnl, returnPct, startValue: baseVal, endValue: endVal,
    positiveDays: pos, negativeDays: neg, best, worst,
    days: s.dates.length, series: s
  };
}

function twrStats(series, days) {
  const daily = buildDailyAnalytics();
  const n = series.values.length;
  const lookback = days ? Math.min(days, n - 1) : n - 1;
  let start = Math.max(1, n - 1 - lookback);
  let cum = 1;
  let peak = 1;
  let maxDd = 0;
  let pos = 0;
  const points = [];
  for (let i = start; i < n; i++) {
    const prev = series.values[i - 1];
    const r = prev > 0 ? (series.pnls[i] || 0) / prev : 0;
    cum *= (1 + r);
    if (r > 0.000001) pos++;
    if (cum > peak) peak = cum;
    const dd = peak > 0 ? cum / peak - 1 : 0;
    if (dd < maxDd) maxDd = dd;
    points.push({ date: daily.dates[i], value: cum - 1, daily: r });
  }
  const totalReturn = cum - 1;
  const d = Math.max(1, n - 1 - start);
  const annualized = Math.pow(Math.max(0.0001, 1 + totalReturn), 365 / d) - 1;
  return { points, totalReturn, annualized, maxDrawdown: maxDd, positiveRate: points.length ? pos / points.length : 0, days: d };
}

function accountSeries(accountId, days) {
  const daily = buildDailyAnalytics();
  const a = daily.byAccount.get(accountId);
  if (!a) return null;
  return Object.assign({}, a, {
    baseValues: a.values,
    basePnls: a.pnls,
    values: a.nativeValues || a.values,
    pnls: a.nativePnls || a.pnls
  });
}

/* ---------- current group breakdown ---------- */
function groupBreakdown(schemeId) {
  const daily = buildDailyAnalytics();
  const gs = groupDailySeries(schemeId);
  const last = daily.n - 1;
  const total = Math.max(0, sum(gs.groups, g => g.values[last]));
  const targetTotal = schemeTargetTotal(gs.scheme);
  const norm = targetTotal > 0 ? targetTotal : 100;
  const items = gs.groups.map(g => {
    const value = Math.max(0, g.values[last] || 0);
    const pct = total > 0 ? value / total : 0;
    const targetRaw = g.id === '__ungrouped' ? 0 : rebalanceTargetFor(gs.scheme, g);
    const normalizedTarget = g.id === '__ungrouped' ? 0 : (targetRaw / norm) * 100;
    const targetValue = total * normalizedTarget / 100;
    const delta = targetValue - value;
    const drift = pct * 100 - normalizedTarget;
    return {
      id: g.id, name: g.name, color: g.color, group: g.group || g, target: targetRaw,
      normalizedTarget, targetValue, value, pct, delta, drift,
      values: g.values, pnls: g.pnls
    };
  });
  const consider = state.settings.considerFx;
  const tolerance = Number(state.settings.tolerance) || 0;
  items.forEach(it => {
    if (it.id === '__ungrouped') { it.status = 'unassigned'; return; }
    if (gs.scheme && gs.scheme.builtin && !rebalanceEnabled(gs.scheme)) { it.status = 'auto'; return; }
    it.status = it.drift > tolerance ? 'high' : it.drift < -tolerance ? 'low' : 'ok';
  });
  return { scheme: gs.scheme, items, total, tolerance, targetTotal, dates: daily.dates, ungrouped: items.find(x => x.id === '__ungrouped') || null };
}

function groupPeriodSummary(schemeId, days) {
  const gs = groupDailySeries(schemeId);
  const n = gs.n;
  const lookback = days || 365;
  const startIdx = Math.max(1, n - 1 - lookback);
  return gs.groups.map(g => {
    const pnl = sum(g.pnls.slice(startIdx, n));
    const startVal = g.values[startIdx - 1] || 0;
    return { group: g, pnl, returnPct: startVal > 0 ? pnl / startVal : 0 };
  });
}

/* ---------- flow / waterfall ---------- */
const FLOW_FIELD_META = {
  opening: { label: '期初金额', title: '期初金额调整' },
  ending:  { label: '期末余额', title: '期末金额调整' },
  profit:  { label: '资产盈亏', title: '资产盈亏调整' },
  in:      { label: '投入',     title: '存入金额调整' },
  out:     { label: '转出',     title: '取出金额调整' }
};

function flowPeriodLabel(periodKey) {
  return periodKey === 'all' ? '记账以来' : periodKey + '年';
}
function flowPeriodBounds(periodKey) {
  if (!periodKey || periodKey === 'all') return { start: null, end: todayKey(), label: '记账以来' };
  const year = String(periodKey).slice(0, 4);
  let end = year + '-12-31';
  if (end > todayKey()) end = todayKey();
  return { start: year + '-01-01', end: end, label: year + '年' };
}
function flowPeriods(scope, id) {
  const values = new Set(['all']);
  const recs = scope === 'account' ? recordsForAccount(id) : recordsForInstrument(id);
  recs.forEach(r => { if (r.date) values.add(String(r.date).slice(0, 4)); });
  (state.records || []).forEach(r => {
    if (r.type !== 'flow' || r.periodKey === 'all') return;
    if (scope === 'account' ? (r.accountId === id && !r.instrumentId) : r.instrumentId === id) values.add(String(r.periodKey));
  });
  if (recs.length) values.add(todayKey().slice(0, 4));
  return Array.from(values).sort((a, b) => a === 'all' ? -1 : b === 'all' ? 1 : Number(b) - Number(a));
}
function flowPeriodKey(scope, id) {
  const map = scope === 'account' ? (ui.flowAccountPeriod || {}) : (ui.flowInstrumentPeriod || {});
  const key = map[id];
  return flowPeriods(scope, id).indexOf(key) >= 0 ? key : 'all';
}
function flowValueAt(series, date) {
  if (!series) return 0;
  const daily = buildDailyAnalytics();
  let idx = daily.indexMap.get(date);
  if (idx == null) {
    for (let i = daily.dates.length - 1; i >= 0; i--) {
      if (daily.dates[i] <= date) { idx = i; break; }
    }
  }
  return idx == null ? 0 : (series.values[idx] || 0);
}
function flowRecordBase(rec, ccy, mode) {
  const amount = Number(rec.amount) || 0;
  const fee = Number(rec.fee) || 0;
  const rate = recordFx(rec, ccy) / rateCNY(baseCurrency());
  if (mode === 'buy') return (amount + fee) * rate;
  if (mode === 'sell') return (amount - fee) * rate;
  if (mode === 'income') return amount * rate;
  return amount * rate;
}
function flowInPeriod(rec, bounds) {
  if (!rec || !rec.date) return false;
  if (bounds.start && rec.date < bounds.start) return false;
  if (bounds.end && rec.date > bounds.end) return false;
  return true;
}
function accountFlow(accountId, periodKey) {
  const account = accountById(accountId);
  if (!account) return null;
  const key = periodKey || 'all';
  const bounds = flowPeriodBounds(key);
  const daily = buildDailyAnalytics();
  const rawSeries = daily.byAccount.get(accountId);
  const series = rawSeries ? Object.assign({}, rawSeries, {
    values: rawSeries.nativeValues || rawSeries.values,
    pnls: rawSeries.nativePnls || rawSeries.pnls
  }) : null;
  const recs = recordsForAccount(accountId);
  let beginning = bounds.start ? flowValueAt(series, addDays(bounds.start, -1)) : 0;
  if (bounds.start) {
    recs.filter(r => r.type === 'flow' && r.ledgerAdjust && r.flowField === 'opening' && r.date === bounds.start)
      .forEach(r => { beginning += (Number(r.netDeltaNative) || 0); });
  }
  const ending = flowValueAt(series, bounds.end);
  let inAmt = 0, outAmt = 0;
  recs.forEach(r => {
    if (!flowInPeriod(r, bounds)) return;
    if (r.type === 'deposit') inAmt += Number(r.amount) || 0;
    else if (r.type === 'withdraw') outAmt += Number(r.amount) || 0;
    else if (r.type === 'flow' && r.ledgerAdjust) {
      if (r.flowField === 'in') inAmt += Number(r.flowDeltaNative) || 0;
      else if (r.flowField === 'out') outAmt += Number(r.flowDeltaNative) || 0;
      else if (r.flowField === 'opening' && !bounds.start) inAmt += Number(r.netDeltaNative) || 0;
    }
  });
  const net = inAmt - outAmt;
  const profit = ending - beginning - net;
  return {
    scope: 'account', periodKey: key, periodLabel: bounds.label, currency: account.currency,
    beginning, in: inAmt, out: outAmt, net, profit, ending,
    label: bounds.label,
    adjusted: recs.some(r => r.type === 'flow' && r.ledgerAdjust && (key === 'all' || r.periodKey === key))
  };
}
function instrumentFlow(instrumentId, periodKey) {
  const im = computeInstrumentMetrics(instrumentId);
  if (!im) return null;
  const inst = im.inst;
  const key = periodKey || 'all';
  const bounds = flowPeriodBounds(key);
  const daily = buildDailyAnalytics();
  const raw = daily.byInstrument.get(instrumentId);
  const series = raw ? Object.assign({}, raw, {
    values: raw.nativeValues || raw.values,
    pnls: raw.nativePnls || raw.pnls
  }) : null;
  const beginning = bounds.start ? flowValueAt(series, addDays(bounds.start, -1)) : 0;
  const ending = flowValueAt(series, bounds.end);
  let inAmt = 0, outAmt = 0;
  recordsForInstrument(instrumentId).forEach(r => {
    if (!flowInPeriod(r, bounds)) return;
    const fee = Number(r.fee) || 0;
    if (r.type === 'buy') inAmt += (Number(r.amount) || 0) + fee;
    else if (r.type === 'sell') outAmt += (Number(r.amount) || 0) - fee;
    else if (r.type === 'dividend') outAmt += Number(r.amount) || 0;
  });
  const net = inAmt - outAmt;
  const profit = ending - beginning - net;
  return {
    scope: 'instrument', periodKey: key, periodLabel: bounds.label, currency: inst.currency,
    beginning, in: inAmt, out: outAmt, net, profit, ending,
    label: bounds.label
  };
}

/* ---------- current snapshot for a group ---------- */
function groupComponents(schemeId, groupId) {
  const scheme = schemeById(schemeId);
  if (!scheme) return [];
  const out = [];
  accounts().forEach(account => {
    const cashGroup = resolveGroupId(scheme, account, null);
    if (cashGroup === groupId) {
      const am = computeAccountMetrics(account.id);
      out.push({ type: 'cash', account, name: account.name + ' · 现金', value: am.cashBase });
    }
    instrumentsOf(account).forEach(inst => {
      const gid = resolveGroupId(scheme, account, inst);
      if (gid === groupId) {
        const im = computeInstrumentMetrics(inst.id);
        if (im.qty > 0.000001) out.push({ type: 'instrument', account, instrument: inst, name: inst.name, value: im.marketBase });
      }
    });
  });
  return out.sort((a, b) => b.value - a.value);
}

/* ---------- price range ---------- */
function priceSeriesRange(instrumentId, days) {
  const inst = instrumentById(instrumentId);
  let list = priceList(instrumentId);
  if (!list.length) return [];
  // 行情标的优先使用真实行情序列；交易/演示记录只用于无行情标的。
  if (inst && inst.market && inst.market.historyLoaded) {
    const marketPoints = list.filter(p => p[2] === 'market');
    if (marketPoints.length > 2) list = marketPoints;
  }
  const end = todayKey();
  const start = days ? addDays(end, -days) : list[0][0];
  return list.filter(([d]) => d >= start && d <= end);
}

function recordAccount(rec) { return accountById(rec.accountId); }

    const cls = rec.flowField === 'out' ? 'loss' : (rec.flowField === 'in' || (rec.flowField === 'profit' && v > 0)) ? 'gain' : (rec.flowField === 'profit' && v < 0 ? 'loss' : '');

function recordTone(rec) {

/* ---------- mutation helpers ---------- */
function upsertPricePoint(instrumentId, date, price, source) {
  if (!state.prices[instrumentId]) state.prices[instrumentId] = [];
  const list = state.prices[instrumentId];
  const idx = list.findIndex(([d]) => d === date);
  if (idx >= 0) { list[idx][1] = price; list[idx][2] = source || list[idx][2] || 'record'; }
  else {
    list.push([date, price, source || 'record']);
    list.sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);
  }
}
function addRecord(rec) {
  state.records.push(Object.assign({
    id: uid('rec'), date: todayKey(), type: 'deposit', accountId: '', instrumentId: null,
    amount: 0, qty: 0, price: 0, fee: 0, fxRate: 0, note: '', createdAt: nowISO()
  }, rec));
  rebuildAllRecordPrices();
  saveState();
}
function removePricePoint(instrumentId, date, price) {
  const list = state.prices[instrumentId];
  if (!list) return;
  const idx = list.findIndex(([d, p]) => d === date && Math.abs(Number(p) - Number(price)) < 1e-9);
  if (idx >= 0) list.splice(idx, 1);
}
function deleteRecord(recId) {
  const rec = state.records.find(r => r.id === recId);
  if (!rec) return;
  if (rec.type === 'price' && rec.pricePoint) removePricePoint(rec.instrumentId, rec.date, rec.price);
  state.records = state.records.filter(r => r.id !== recId);
  rebuildAllRecordPrices();
  saveState();
}
function rateForRecord(ccy, date) {
  return fxAt(ccy, date);
}

function importData(text) {

/* ---------- names ---------- */
function normalizeTypeList(list, defaults, kind) {
  const source = Array.isArray(list) && list.length ? list : [];
  const out = [];
  const seen = new Set();
  source.forEach((raw, index) => {
    if (!raw || typeof raw !== 'object') return;
    const id = String(raw.id || '').trim() || uid(kind + '_type');
    if (seen.has(id)) return;
    const fallback = defaults.find(d => d.id === id);
    const name = String(raw.name || '').trim() || (fallback && fallback.name) || '未命名类型';
    const color = /^#[0-9a-f]{6}$/i.test(String(raw.color || '')) ? raw.color : ((fallback && fallback.color) || autoGroupColor(index));
    const item = {
      id, name, color,
      builtin: raw.builtin == null ? !!(fallback && fallback.builtin) : !!raw.builtin
    };
    if (kind === 'instrument') {
      item.short = String(raw.short || '').trim() || (fallback && fallback.short) || name.slice(0, 2);
      item.group = String(raw.group || '').trim() || (fallback && fallback.group) || 'other';
    }
    out.push(item);
    seen.add(id);
  });
  defaults.forEach(d => {
    if (!seen.has(d.id)) { out.push(Object.assign({}, d)); seen.add(d.id); }
  });
  return out;
}
function accountTypes() {
  return Array.isArray(state.accountTypes) && state.accountTypes.length ? state.accountTypes : defaultAccountTypes();
}
function instrumentTypes() {
  return Array.isArray(state.instrumentTypes) && state.instrumentTypes.length ? state.instrumentTypes : defaultInstrumentTypes();
}
function accountTypeMeta(type) {

}
function accountTypeName(type) { return accountTypeMeta(type).name; }
function accountTypeLabel(type) { return accountTypeName(type); }
function instrumentTypeMeta(cls) {
  return instrumentTypes().find(t => t.id === cls) || { id: cls || 'other', name: cls || '其他', short: '其他', color: '#9ca3af', group: 'other' };
}
function instrumentTypeName(cls) { return instrumentTypeMeta(cls).name; }
function instrumentTypeColor(cls) { return instrumentTypeMeta(cls).color; }
function accountTypeOptions() { return accountTypes().map(t => ({ value: t.id, label: t.name })); }
function instrumentTypeOptions() {
  return instrumentTypes().filter(t => t.id !== 'cash').map(t => ({ value: t.id, label: t.name }));

function chartEmptyHTML(text, height) {

function chartAxisText(v, mode, ccy) {
  if (mode === 'percent') return (v * 100).toFixed(Math.abs(v) < 0.01 ? 2 : 1) + '%';
  if (state && state.settings && state.settings.hideAmounts) return '••';
  const n = Number(v) || 0;
  const abs = Math.abs(n);
  if (abs >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, '') + '亿';
  if (abs >= 1000000) return (n / 10000).toFixed(0) + '万';
  if (abs >= 100000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
  if (abs >= 10000) return (n / 10000).toFixed(2).replace(/\.?0+$/, '') + '万';
  if (abs >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
  return abs < 10 ? n.toFixed(2) : Math.round(n).toString();
}

function lineChartHTML(opts) {
  const o = opts || {};
  const id = o.id || chartId();
  const points = (o.points || []).filter(p => p && Number.isFinite(Number(p.value)));
  const height = o.height || 188;
  const W = 360, H = height;
  const pad = { l: o.showY === false ? 8 : 38, r: 8, t: 13, b: 24 };
  if (points.length < 2) return chartEmptyHTML(o.emptyText || '暂无足够数据', height + 24);
  const vals = points.map(p => Number(p.value));
  let min = Math.min(...vals), max = Math.max(...vals);
  if (o.baseline || (min < 0 && max > 0)) { min = Math.min(min, 0); max = Math.max(max, 0); }
  if (min === max) { const padV = Math.abs(min) * 0.02 || 1; min -= padV; max += padV; }
  const span = max - min;
  min -= span * 0.09;
  max += span * 0.09;
  if (o.baseline) { min = Math.min(min, 0); max = Math.max(max, 0); }
  const plotW = W - pad.l - pad.r;
  const plotH = H - pad.t - pad.b;
  const x = i => pad.l + (points.length === 1 ? 0 : i / (points.length - 1)) * plotW;
  const y = v => pad.t + (1 - (v - min) / (max - min || 1)) * plotH;
  const color = o.color || '#ff9f45';
  const gid = 'grad_' + id;
  const zeroY = y(0);
  let d = '';
  points.forEach((p, i) => { d += (i === 0 ? 'M' : 'L') + x(i).toFixed(2) + ',' + y(Number(p.value)).toFixed(2); });
  let areaD = d;
  if (o.baseline || (min < 0 && max > 0)) areaD += 'L' + x(points.length - 1).toFixed(2) + ',' + zeroY.toFixed(2) + 'L' + x(0).toFixed(2) + ',' + zeroY.toFixed(2) + 'Z';
  else areaD += 'L' + x(points.length - 1).toFixed(2) + ',' + (H - pad.b) + 'L' + x(0).toFixed(2) + ',' + (H - pad.b) + 'Z';
  let grid = '', labels = '';
  const ticks = 3;
  for (let i = 0; i < ticks; i++) {
    const v = min + (max - min) * (i / (ticks - 1));
    const yy = y(v);
    if (o.showY !== false) {
      grid += '<line class="grid-line" x1="' + pad.l + '" y1="' + yy.toFixed(2) + '" x2="' + (W - pad.r) + '" y2="' + yy.toFixed(2) + '"/>';
      labels += '<text class="axis-label" x="' + (pad.l - 6) + '" y="' + (yy + 3).toFixed(2) + '" text-anchor="end">' + esc(chartAxisText(v, o.mode, o.currency)) + '</text>';
    }
  }
  if (min < 0 && max > 0) {
    grid += '<line x1="' + pad.l + '" y1="' + zeroY.toFixed(2) + '" x2="' + (W - pad.r) + '" y2="' + zeroY.toFixed(2) + '" stroke="rgba(255,255,255,.17)" stroke-width=".7" stroke-dasharray="3 4"/>';
  }
  const labelIdx = points.length <= 4 ? points.map((_, i) => i) : [0, Math.floor((points.length - 1) / 3), Math.floor((points.length - 1) * 2 / 3), points.length - 1].filter((v, i, a) => a.indexOf(v) === i);
  labelIdx.forEach(i => {
    const anchor = i === 0 ? 'start' : i === points.length - 1 ? 'end' : 'middle';
    labels += '<text class="axis-label" x="' + x(i).toFixed(2) + '" y="' + (H - 6) + '" text-anchor="' + anchor + '">' + esc(shortDate(points[i].date)) + '</text>';
  });
  const last = points[points.length - 1];
  const lastX = x(points.length - 1), lastY = y(Number(last.value));
  const tipFmt = value => {
    if (o.mode === 'percent') return fmtPct(value, 2, true);
    if (o.mode === 'price') return fmtPrice(value, o.currency);
    return fmtMoney(value, { currency: o.currency, decimals: Math.abs(value) >= 1000 ? 0 : 2 });
  };
  chartRegistry[id] = {
    id, points, W, H, pad, plotW, plotH, min, max,
    dateOf: p => p.date,
    fmt: tipFmt,
    mode: o.mode
  };
  const svg = '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="' + esc(o.aria || '资产趋势图') + '">' +
    '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + color + '" stop-opacity=".27"/><stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
    grid +
    '<path class="area" d="' + areaD + '" fill="url(#' + gid + ')"/>' +
    '<path class="line" d="' + d + '" stroke="' + color + '"/>' +
    '<line class="crosshair" data-hover="line" x1="0" y1="' + pad.t + '" x2="0" y2="' + (H - pad.b) + '" opacity="0"/>' +
    '<circle class="last-dot" cx="' + lastX.toFixed(2) + '" cy="' + lastY.toFixed(2) + '" r="3.1" fill="' + color + '"/>' +
    '<circle class="hover-dot" data-hover="dot" cx="0" cy="0" r="3.8" fill="' + color + '" opacity="0"/>' +
    labels +
    '</svg>';
  return '<div class="chart-block" data-chart="' + id + '">' + svg + '<div class="chart-tip" data-tip="' + id + '"><div class="d"></div><div class="v"></div><div class="p"></div></div></div>';
}

/* ---------- donut ---------- */
function donutBoxHTML(items, opts) {
  const o = opts || {};

/* ---------- sankey ---------- */
function shortLabel(text, max) {
  const s = String(text || '');
  return s.length > max ? s.slice(0, max) + '…' : s;
}

function sankeyHTML(schemeId, mode) {
  const gb = groupBreakdown(schemeId);
  const daily = buildDailyAnalytics();
  const last = daily.n - 1;
  const scheme = gb.scheme;
  if (!scheme || gb.total <= 0) return chartEmptyHTML('还没有可用于桑基图的资产', 260);
  let visibleGroups = gb.items.filter(g => g.value > 0.5 && g.id !== '__ungrouped');
  if (gb.ungrouped && gb.ungrouped.value > 0.5) visibleGroups.push(gb.ungrouped);
  if (!visibleGroups.length) return chartEmptyHTML('还没有可用于桑基图的资产', 260);
  const total = sum(visibleGroups, g => g.value);
  let restGroupIds = new Set();
  if (visibleGroups.length > 6) {
    const sorted = visibleGroups.slice().sort((a, b) => b.value - a.value);
    const rest = sorted.slice(5);
    rest.forEach(g => restGroupIds.add(g.id));
    visibleGroups = sorted.slice(0, 5).concat([{
      id: '__sankey_other', name: '其他 ' + rest.length + ' 组', color: '#6b7280',
      value: sum(rest, x => x.value), pct: sum(rest, x => x.pct), target: 0,
      normalizedTarget: 0, status: 'auto', synthetic: true
    }]);
  }

  // group -> leaves
  const groupData = [];
  visibleGroups.forEach(g => {
    const leafMap = new Map();
    daily.components.forEach(comp => {
      const account = comp.account;
      const inst = comp.inst || null;
      const compGroup = resolveGroupId(scheme, account, inst) || '__ungrouped';
      const match = g.id === '__sankey_other' ? restGroupIds.has(compGroup) : compGroup === g.id;
      if (!match) return;
      const value = comp.values[last] || 0;
      if (value <= 0.5) return;
      let key, label, sub;
      if (mode === 'instrument' && inst) {
        key = 'inst:' + inst.id;
        label = inst.name;
        sub = account.name;
      } else if (mode === 'instrument') {
        key = 'cash:' + account.id;
        label = account.name + ' 现金';
        sub = account.currency;
      } else {
        key = 'acc:' + account.id;
        label = account.name;
        sub = account.currency + ' · ' + (inst ? inst.name : '现金');
      }
      if (!leafMap.has(key)) leafMap.set(key, { key, label, sub, value: 0, groupId: g.id, color: g.color });
      leafMap.get(key).value += value;
    });
    let leaves = Array.from(leafMap.values()).sort((a, b) => b.value - a.value);
    if (leaves.length > 6) {
      const rest = leaves.slice(5);
      leaves = leaves.slice(0, 5).concat([{ key: 'other:' + g.id, label: '其他 ' + rest.length + ' 项', sub: '', value: sum(rest, x => x.value), groupId: g.id, color: g.color }]);
    }
    groupData.push({ group: g, leaves });
  });

  // unique leaves across groups
  const leafTotals = new Map();
  groupData.forEach(gd => gd.leaves.forEach(l => {
    if (!leafTotals.has(l.key)) leafTotals.set(l.key, { key: l.key, label: l.label, sub: l.sub, value: 0, color: l.color });
    leafTotals.get(l.key).value += l.value;
  }));
  const leaves = Array.from(leafTotals.values()).sort((a, b) => b.value - a.value);

  const nG = groupData.length, nL = leaves.length;
  const minHeight = Math.max(
    58 + 22 + nG * 12 + Math.max(0, nG - 1) * 12 + 8,
    58 + 22 + nL * 11 + Math.max(0, nL - 1) * 6 + 8
  );
  const H = clamp(Math.max(340 + Math.max(0, nG - 2) * 10 + Math.max(0, nL - 6) * 8, minHeight), 340, 760);
  const W = 360;
  const top = 58, bottom = 22;
  const x0 = 8, x1 = 116, x2 = 232;
  const nodeW = 9;
  const avail = H - top - bottom;
  const gapG = nG > 1 ? 12 : 0;
  const gapL = nL > 1 ? 6 : 0;
  const minGroupH = 12, minLeafH = 11;
  const groupScale = Math.max(0, (avail - gapG * (nG - 1) - minGroupH * nG) / Math.max(1, total));
  const leafScale = Math.max(0, (avail - gapL * (nL - 1) - minLeafH * nL) / Math.max(1, total));

  // group y — reserve a minimum node height, then distribute the rest by value
  let gy = top;
  groupData.forEach(gd => {
    gd.h = minGroupH + gd.group.value * groupScale;
    gd.y = gy;
    gy += gd.h + gapG;
  });
  const groupsBottom = gy - gapG;
  // leaf y — same sizing rule, so the right column cannot overflow vertically
  let ly = top;
  leaves.forEach(l => {
    l.h = minLeafH + l.value * leafScale;
    l.y = ly;
    ly += l.h + gapL;
  });
  const leavesBottom = ly - gapL;
  const groupTop = groupData.length ? groupData[0].y : top;
  const totalNodeY = groupTop;
  const totalNodeH = Math.max(0, groupsBottom - groupTop);

  // allocate incoming slices on leaves
  const incomingByLeaf = new Map();
  groupData.forEach(gd => {
    let sourceY = gd.y;
    gd.leaves.forEach(l => {
      const srcH = gd.group.value > 0 ? gd.h * (l.value / gd.group.value) : 0;
      const link = { group: gd, leafKey: l.key, value: l.value, sy: sourceY, sh: srcH };
      sourceY += srcH;
      if (!incomingByLeaf.has(l.key)) incomingByLeaf.set(l.key, []);
      incomingByLeaf.get(l.key).push(link);
    });
  });
  leaves.forEach(l => {
    const links = incomingByLeaf.get(l.key) || [];
    links.sort((a, b) => a.group.y - b.group.y);
    let ty = l.y;
    links.forEach(link => {
      const th = l.value > 0 ? l.h * (link.value / l.value) : 0;
      link.ty = ty; link.th = th;
      ty += th;
    });
  });

  function linkPath(sx, sy, sh, tx, ty, th) {
    const c1 = sx + 46, c2 = tx - 46;
    return 'M' + sx + ',' + sy.toFixed(2) +
      ' C' + c1 + ',' + sy.toFixed(2) + ' ' + c2 + ',' + ty.toFixed(2) + ' ' + tx + ',' + ty.toFixed(2) +
      ' L' + tx + ',' + (ty + th).toFixed(2) +
      ' C' + c2 + ',' + (ty + th).toFixed(2) + ' ' + c1 + ',' + (sy + sh).toFixed(2) + ' ' + sx + ',' + (sy + sh).toFixed(2) + 'Z';
  }

  let linksSvg = '', nodesSvg = '', labelsSvg = '';
  // total -> group links
  let totalSourceY = totalNodeY;
  groupData.forEach((gd, gi) => {
    linksSvg += '<path class="sankey-link" d="' + linkPath(x0 + nodeW, totalSourceY, gd.h, x1, gd.y, gd.h) + '" fill="' + gd.group.color + '" opacity=".16"/>';
    totalSourceY += gd.h + (gi < groupData.length - 1 ? gapG : 0);
  });
  // group -> leaf links
  groupData.forEach(gd => {
    gd.leaves.forEach(l => {
      const link = (incomingByLeaf.get(l.key) || []).find(x => x.group === gd);
      if (!link) return;
      linksSvg += '<path class="sankey-link" d="' + linkPath(x1 + nodeW, link.sy, link.sh, x2, link.ty, link.th) + '" fill="' + gd.group.color + '" opacity=".19"/>';
    });
  });
  // nodes & labels
  nodesSvg += '<rect x="' + x0 + '" y="' + totalNodeY.toFixed(2) + '" width="' + nodeW + '" height="' + totalNodeH.toFixed(2) + '" rx="4" fill="url(#sankeyTotal)"/>';
  labelsSvg += '<text class="sankey-head" x="' + x0 + '" y="15">总资产</text>' +
    '<text class="sankey-total" x="' + x0 + '" y="34">' + esc(fmtMoney(total, { compact: true, decimals: 2 })) + '</text>' +
    '<text class="sankey-head" x="' + x1 + '" y="15">分组</text>' +
    '<text class="sankey-head" x="' + x2 + '" y="15">' + (mode === 'instrument' ? '底层标的' : '账户') + '</text>';
  groupData.forEach(gd => {
    nodesSvg += '<rect x="' + x1 + '" y="' + gd.y.toFixed(2) + '" width="' + nodeW + '" height="' + gd.h.toFixed(2) + '" rx="4" fill="' + gd.group.color + '"/>';
    const cy = gd.y + gd.h / 2;
    labelsSvg += '<text class="sankey-label" x="' + (x1 - 8) + '" y="' + (cy + (gd.h >= 24 ? -2 : 3)).toFixed(2) + '" text-anchor="end">' + esc(shortLabel(gd.group.name, 7)) + '</text>' +
      (gd.h >= 24 ? '<text class="sankey-sub" x="' + (x1 - 8) + '" y="' + (cy + 9).toFixed(2) + '" text-anchor="end">' + esc(fmtMoney(gd.group.value, { compact: true })) + '</text>' : '');
  });
  leaves.forEach(l => {
    nodesSvg += '<rect x="' + x2 + '" y="' + l.y.toFixed(2) + '" width="8" height="' + l.h.toFixed(2) + '" rx="3" fill="' + l.color + '"/>';
    const cy = l.y + l.h / 2;
    const line = shortLabel(l.label, 6) + ' · ' + fmtMoney(l.value, { compact: true });
    labelsSvg += '<text class="sankey-label" x="' + (x2 + 15) + '" y="' + (cy + 2.8).toFixed(2) + '">' + esc(line) + '</text>';
  });

  return '<div class="sankey-shell"><svg class="sankey-svg" viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="资产流向桑基图" style="height:auto;display:block">' +
    '<defs><linearGradient id="sankeyTotal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9f45"/><stop offset=".55" stop-color="#5b8cff"/><stop offset="1" stop-color="#b18cff"/></linearGradient></defs>' +
    linksSvg + nodesSvg + labelsSvg + '</svg></div>';
}

/* ---------- chart interactions ---------- */
function bindCharts() {
  $$('[data-chart]').forEach(wrap => {
    if (wrap.dataset.bound) return;
    wrap.dataset.bound = '1';
    const id = wrap.getAttribute('data-chart');
    const meta = chartRegistry[id];
    if (!meta) return;
    const svg = $('svg', wrap);
    const tip = $('[data-tip]', wrap);
    const line = $('[data-hover="line"]', svg);
    const dot = $('[data-hover="dot"]', svg);
    const show = (clientX) => {
      const rect = wrap.getBoundingClientRect();
      const frac = clamp((clientX - rect.left) / Math.max(1, rect.width), 0, 1);
      const index = Math.round(frac * (meta.points.length - 1));
      const p = meta.points[index];
      if (!p) return;
      const xv = meta.pad.l + frac * meta.plotW;
      const yv = meta.pad.t + (1 - (Number(p.value) - meta.min) / (meta.max - meta.min || 1)) * meta.plotH;
      if (line) { line.setAttribute('x1', xv); line.setAttribute('x2', xv); line.setAttribute('opacity', '1'); }
      if (dot) { dot.setAttribute('cx', xv); dot.setAttribute('cy', yv); dot.setAttribute('opacity', '1'); }
      if (tip) {
        const dateEl = $('.d', tip), valueEl = $('.v', tip), pctEl = $('.p', tip);
        dateEl.textContent = p.date || '';
        valueEl.textContent = meta.fmt(p.value);
        pctEl.textContent = meta.mode === 'percent' ? '' : '';
        const left = (xv / meta.W) * rect.width;
        const top = (yv / meta.H) * rect.height;
        tip.style.left = clamp(left, 44, rect.width - 44) + 'px';
        tip.style.top = Math.max(32, top) + 'px';
        tip.classList.add('show');
      }
    };
    const hide = () => {
      if (line) line.setAttribute('opacity', '0');
      if (dot) dot.setAttribute('opacity', '0');
      if (tip) tip.classList.remove('show');
    };
    wrap.addEventListener('pointermove', e => show(e.clientX));
    wrap.addEventListener('pointerdown', e => { show(e.clientX); });
    wrap.addEventListener('pointerenter', e => show(e.clientX));
    wrap.addEventListener('pointerleave', hide);
    wrap.addEventListener('pointercancel', hide);
  });
}

const TABS = [
  { key: 'assets',    label: '资产', icon: 'wallet',   href: '#/assets' },
  { key: 'stats',     label: '统计', icon: 'chart',    href: '#/stats' },
  { key: 'calendar',  label: '日历', icon: 'calendar', href: '#/calendar' },
  { key: 'rebalance', label: '再平衡', icon: 'scale',    href: '#/rebalance' },
  { key: 'settings',  label: '我的', icon: 'user',     href: '#/settings' }
];
const PAGE_TITLES = { assets: '资产', stats: '统计', calendar: '收益日历', rebalance: '再平衡', settings: '我的' };

let lastRouteKey = '';
let overlayDepth = 0;

function parseRoute() {
  const raw = String(location.hash || '').replace(/^#\/?/, '');
  const parts = raw.split('/').filter(Boolean);
  if (!parts.length) return { name: 'assets' };
  if (parts[0] === 'account' && parts[1]) return { name: 'account', id: decodeURIComponent(parts[1]) };
  if (parts[0] === 'instrument' && parts[1]) return { name: 'instrument', id: decodeURIComponent(parts[1]) };
  if (parts[0] === 'groups' && parts[1]) return { name: 'groups', schemeId: decodeURIComponent(parts[1]) };
  if (parts[0] === 'types') return { name: 'types' };
  if (TABS.some(t => t.key === parts[0])) return { name: parts[0] };
  return { name: 'assets' };
}
function routeKey(r) { return r.name + '|' + (r.id || r.schemeId || ''); }
function activeTabFor(route) {
  if (route.name === 'account' || route.name === 'instrument') return 'assets';
  if (route.name === 'groups' || route.name === 'types') return 'settings';
  return route.name;
}
function navigate(hash, replace) {
  const target = hash.indexOf('#') === 0 ? hash : '#/' + hash.replace(/^\/+/, '');
  if (replace) history.replaceState(null, '', target);
  else if (location.hash !== target) location.hash = target;
  else renderPage({ scroll: false });
}
function goBack(fallback) {
  if (history.length > 1) history.back();
  else navigate(fallback || '#/assets');
}

function renderTabbar(active) {
  const el = $('#tabbar');
  if (!el) return;
  el.innerHTML = TABS.map(t => {
    const on = t.key === active;
    return '<a class="tab-item ' + (on ? 'active' : '') + '" href="' + t.href + '" aria-label="' + t.label + '"' + (on ? ' aria-current="page"' : '') + '>' +
      '<span class="tab-ico">' + icon(t.icon) + '</span><span>' + t.label + '</span></a>';
  }).join('');
}

function renderPage(opts) {
  applyTheme();
  const o = opts || {};
  const route = parseRoute();
  const isDetail = route.name === 'account' || route.name === 'instrument' || route.name === 'groups' || route.name === 'types';
  const screen = $('#screen');
  const scrollY = window.scrollY;
  const prevKey = lastRouteKey;
  chartRegistry = {};
  let html = '';
  if (route.name === 'assets') html = renderAssetsPage();
  else if (route.name === 'stats') html = renderStatsPage();
  else if (route.name === 'calendar') html = renderCalendarPage();
  else if (route.name === 'rebalance') html = renderRebalancePage();
  else if (route.name === 'settings') html = renderSettingsPage();
  else if (route.name === 'account') html = renderAccountPage(route.id);
  else if (route.name === 'instrument') html = renderInstrumentPage(route.id);
  else if (route.name === 'groups') html = renderGroupsPage(route.schemeId);
  else if (route.name === 'types') html = renderTypesPage();
  if (!html) html = renderNotFound();
  screen.className = 'screen' + (isDetail ? ' detail-screen' : '');
  screen.innerHTML = '<div class="page">' + html + '</div>';
  const tabbar = $('#tabbar');
  tabbar.style.display = isDetail ? 'none' : 'grid';
  renderTabbar(activeTabFor(route));
  bindCharts();
  if (typeof afterRenderPage === 'function') afterRenderPage(route);
  const newKey = routeKey(route);
  if (o.scroll === false) {
    // keep position
  } else if (newKey !== prevKey) {
    window.scrollTo(0, 0);
  } else if (o.keepScroll) {
    window.scrollTo(0, scrollY);
  } else {
    window.scrollTo(0, 0);
  }
  lastRouteKey = newKey;
  document.body.classList.toggle('is-detail', isDetail);
  if (route.name === 'instrument') {
    const im = instrumentById(route.id);
    if (im && im.market) setTimeout(() => ensureInstrumentHistory(route.id), 80);
  }
  if (route.name === 'account') setTimeout(() => ensureAccountHistories(route.id), 80);
}
function refreshPage() {
  const y = window.scrollY;
  renderPage({ scroll: false });
  requestAnimationFrame(() => window.scrollTo(0, y));
}

/* ---------- amount formatting ---------- */
function moneyParts(v, ccy) {
  const sym = symbolFor(ccy || baseCurrency());
  if (state && state.settings && state.settings.hideAmounts) return { sym, main: '••••••', dec: '' };
  const n = Number(v) || 0;
  const abs = Math.abs(n);
  const fixed = abs.toFixed(2);
  const parts = fixed.split('.');
  const main = Number(parts[0]).toLocaleString('zh-CN');
  return { sym: (n < 0 ? '-' : '') + sym, main, dec: parts[1] };
}
function fmtBase(v, opts) { return fmtMoney(v, Object.assign({ currency: baseCurrency() }, opts || {})); }
function signedPct(v, digits) { return fmtPct(v, digits == null ? 2 : digits, true); }

function tinyMoney(v) { return fmtMoney(v, { compact: true, decimals: 2 }); }

/* ---------- sheet / dialog ---------- */
function lockBodyScroll() {
  if (overlayDepth === 1) document.body.style.overflow = 'hidden';
}
function unlockBodyScroll() {
  if (overlayDepth === 0) document.body.style.overflow = '';
}
function openSheet(opts) {
  const o = opts || {};
  const root = $('#overlay-root');
  const wrap = document.createElement('div');
  wrap.className = 'overlay' + (o.center ? ' center' : '');
  const sheetId = o.id || uid('sheet');
  wrap.innerHTML =
    '<section class="sheet ' + (o.className || '') + '" role="dialog" aria-modal="true" aria-label="' + esc(o.title || '') + '">' +
      (o.center ? '' : '<div class="sheet-grab"></div>') +
      '<header class="sheet-head"><div class="st"><h2>' + esc(o.title || '') + '</h2>' + (o.sub ? '<div class="sub">' + o.sub + '</div>' : '') + '</div>' +
      '<button class="sheet-close" data-sheet-close aria-label="关闭">' + icon('x') + '</button></header>' +
      '<div class="sheet-body ' + (o.bodyClass || '') + '">' + (o.body || '') + '</div>' +
      (o.footer ? '<footer class="sheet-foot">' + o.footer + '</footer>' : '') +
    '</section>';
  root.appendChild(wrap);
  overlayDepth++;
  document.body.classList.add('has-overlay');
  lockBodyScroll();
  const close = () => closeSheet(wrap);
  wrap.addEventListener('click', e => {
    if (e.target === wrap && o.dismissible !== false) close();
  });
  wrap.querySelectorAll('form').forEach(form => {
    form.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target && e.target.tagName !== 'TEXTAREA') e.preventDefault();
    });
  });
  if (o.onMount) o.onMount(wrap, sheetId);
  requestAnimationFrame(() => {
    wrap.classList.add('open');
    if (o.onOpen) o.onOpen(wrap, sheetId);
  });
  return wrap;
}
function closeSheet(wrap) {
  if (!wrap || !wrap.parentNode) return;
  wrap.classList.remove('open');
  overlayDepth = Math.max(0, overlayDepth - 1);
  if (overlayDepth === 0) document.body.classList.remove('has-overlay');
  unlockBodyScroll();
  setTimeout(() => { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 300);
}
function closeTopSheet() {
  const all = $$('#overlay-root .overlay');
  if (all.length) closeSheet(all[all.length - 1]);
}
function closeAllSheets() {
  $$('#overlay-root .overlay').forEach(w => { w.classList.remove('open'); if (w.parentNode) w.parentNode.removeChild(w); });
  overlayDepth = 0;
  document.body.classList.remove('has-overlay');
  unlockBodyScroll();
}
function confirmDialog(opts) {
  const o = opts || {};
  const wrap = openSheet({
    center: true,
    title: o.title || '确认操作',
    body: '<div class="modal-text" style="margin-top:0">' + (o.message || '') + '</div>',
    footer: '<button class="btn ghost" data-confirm-cancel>取消</button><button class="btn ' + (o.danger ? 'danger' : 'primary') + '" data-confirm-ok>' + esc(o.confirmText || '确认') + '</button>'
  });
  wrap.querySelector('[data-confirm-cancel]').addEventListener('click', () => closeSheet(wrap));
  wrap.querySelector('[data-confirm-ok]').addEventListener('click', () => {
    closeSheet(wrap);
    if (o.onConfirm) setTimeout(o.onConfirm, 50);
  });
  return wrap;
}
function toast(text, type) {
  const root = $('#toast-root');
  root.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = text;
  root.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(6px)';
    el.style.transition = 'opacity .2s,transform .2s';
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 220);
  }, 2400);
}

function accountComposition(am) {
  const fx = fxToBase(am.account.currency) || 1;
  const list = [{ name: '现金', value: Math.max(0, am.cashNative), color: '#8e9aaf' }];
  am.instruments.filter(x => x.qty > 0.000001).forEach(im => {
    list.push({ name: im.inst.name, value: im.marketBase, color: im.inst.color || im.inst.color2 || '#ff9f45' });
  });
  list.sort((a, b) => b.value - a.value);
  if (list.length > 6) {
    const rest = list.slice(5);
    list.splice(5, list.length, { name: '其他 ' + rest.length + ' 项', value: sum(rest, x => x.value), color: '#6b7280' });
  }
  return { items: list };
}

function accountChartCard(am) {
  const a = am.account;
  const period = Number(ui.accountPeriod == null ? 90 : ui.accountPeriod);
  const mode = ui.accountChartMode || 'value';
  const series = accountSeries(a.id);
  const n = series ? series.values.length : 0;
  const labels = { 30: '近1月', 90: '近3月', 365: '近1年', 0: '全部' };
  let chartHTML = '', metricsHTML = '', rangeText = '';
  if (series && n > 2) {
    const start = period ? Math.max(1, n - period) : 1;
    const ps = periodStats(series, dailyStartDateForIndex(series, start), todayKey());
    const tw = twrStats(series, period || n - 1);
    let points;
    if (mode === 'return') points = tw.points.map(p => ({ date: p.date, value: p.value }));
    else points = series.dates.slice(start).map((d, i) => ({ date: d, value: series.values[start + i] }));
    const color = mode === 'return' ? (tw.totalReturn >= 0 ? '#ff5d6c' : '#35d39a') : '#ff9f45';
    chartHTML = lineChartHTML({
      points, mode: mode === 'return' ? 'percent' : 'money', currency: a.currency, color, height: 174,
      baseline: mode === 'return', aria: '账户资产曲线'
    });
    rangeText = points.length ? dateRangeLabel(points[0].date, points[points.length - 1].date) : '';
    const psPnl = ps.pnl;
    metricsHTML = '<div class="metrics">' +
      '<div class="metric"><div class="lab">区间收益</div><div class="val ' + pnlClass(psPnl) + '">' + pnlText(psPnl, { compact: true, currency: a.currency }) + '</div><div class="sub">金额</div></div>' +
      '<div class="metric"><div class="lab">区间收益率</div><div class="val ' + pnlClass(ps.returnPct) + '">' + fmtPct(ps.returnPct, 2) + '</div><div class="sub">时间加权</div></div>' +
      '<div class="metric"><div class="lab">最大回撤</div><div class="val loss">' + fmtPct(tw.maxDrawdown, 2) + '</div><div class="sub">回撤</div></div>' +
      '<div class="metric"><div class="lab">年化收益</div><div class="val ' + pnlClass(tw.annualized) + '">' + fmtPct(tw.annualized, 1) + '</div><div class="sub">参考</div></div>' +
    '</div>';
  } else {
    chartHTML = chartEmptyHTML('还没有足够的历史数据', 174);
  }
  return '<div class="detail-chart-card">' +
    '<div class="chart-head"><div><h2>收益曲线</h2><div class="sub">' + (rangeText || '记账以来') + ' · ' + a.currency + ' 计价' + (a.currency === baseCurrency() ? '' : ' · 不折算') + '</div></div>' +
      '<div class="segmented small chart-toggle"><button class="seg ' + (mode === 'value' ? 'active' : '') + '" data-action="set-account-chart-mode" data-value="value">资产</button><button class="seg ' + (mode === 'return' ? 'active' : '') + '" data-action="set-account-chart-mode" data-value="return">收益率</button></div></div>' +
    chartHTML + metricsHTML +
    '<div class="period-row"><div class="segmented small">' + [30, 90, 365, 0].map(d => '<button class="seg ' + (period === d ? 'active' : '') + '" data-action="set-account-period" data-value="' + d + '">' + labels[d] + '</button>').join('') + '</div>' +
      '<span class="tiny">' + (n > 2 ? '更新至 ' + shortDate(todayKey()) : '') + '</span></div>' +
  '</div>';
}
function dailyStartDateForIndex(series, startIdx) {
  const daily = buildDailyAnalytics();
  return series.dates && series.dates[startIdx] ? series.dates[startIdx] : daily.dates[Math.max(0, startIdx)];
}

function instrumentChartCard(im) {
  const inst = im.inst;
  const period = Number(ui.instrumentPeriod == null ? 365 : ui.instrumentPeriod);
  const mode = ui.instrumentChartMode === 'profit' ? 'profit' : 'price';
  const labels = { 30: '近1月', 90: '近3月', 365: '近1年', 0: '全部' };
  const list = priceSeriesRange(inst.id, period || 0);
  let chartHTML = '', metricsHTML = '', rangeText = '', lastDate = '';
  if (mode === 'profit') {
    const series = instrumentProfitSeries(im);
    if (series.length > 1) {
      let peak = -Infinity, maxDd = 0;
      series.forEach(p => { if (p.value > peak) peak = p.value; if (Number.isFinite(peak)) maxDd = Math.min(maxDd, p.value - peak); });
      const finalProfit = im.profitNativeInst;
      const color = finalProfit >= 0 ? '#ff5d6c' : '#35d39a';
      chartHTML = lineChartHTML({
        points: series, mode: 'amount', currency: inst.currency,
        color, height: 174, baseline: true, aria: '标的累计收益曲线'
      });
      rangeText = dateRangeLabel(series[0].date, series[series.length - 1].date);
      lastDate = series[series.length - 1].date;
      metricsHTML = '<div class="metrics">' +
        '<div class="metric"><div class="lab">累计收益</div><div class="val ' + pnlClass(finalProfit) + '">' + fmtMoney(finalProfit, { currency: inst.currency }) + '</div><div class="sub">' + inst.currency + '</div></div>' +
        '<div class="metric"><div class="lab">最大回撤</div><div class="val loss">' + fmtMoney(maxDd, { currency: inst.currency }) + '</div><div class="sub">金额</div></div>' +
        '<div class="metric"><div class="lab">持仓收益</div><div class="val ' + pnlClass(im.unrealizedNativeInst) + '">' + fmtMoney(im.unrealizedNativeInst, { currency: inst.currency }) + '</div><div class="sub">未实现</div></div>' +
        '<div class="metric"><div class="lab">累计已实现</div><div class="val ' + pnlClass(im.realized) + '">' + fmtMoney(im.realized, { currency: inst.currency }) + '</div><div class="sub">已落袋</div></div>' +
      '</div>';
    } else {
      chartHTML = chartEmptyHTML('还没有足够的累计收益数据', 174);
    }
  } else if (list.length > 2) {
    const startPrice = list[0][1] || 1;
    const endPrice = list[list.length - 1][1];
    let peak = -Infinity, maxDd = 0;
    list.forEach(([d, p]) => { if (p > peak) peak = p; if (peak > 0) maxDd = Math.min(maxDd, p / peak - 1); });
    const ret = startPrice > 0 ? endPrice / startPrice - 1 : 0;
    const days = Math.max(1, daysBetween(list[0][0], list[list.length - 1][0]));
    const annualized = Math.pow(Math.max(0.0001, endPrice / startPrice), 365 / days) - 1;
    const points = list.map(([d, p]) => ({ date: d, value: p }));
    chartHTML = lineChartHTML({
      points, mode: 'price', currency: inst.currency,
      color: inst.color || '#ff9f45',
      height: 174, baseline: false, aria: '标的价格曲线'
    });
    rangeText = dateRangeLabel(list[0][0], list[list.length - 1][0]);
    lastDate = list[list.length - 1][0];
    metricsHTML = '<div class="metrics">' +
      '<div class="metric"><div class="lab">区间涨跌</div><div class="val ' + pnlClass(ret) + '">' + fmtPct(ret, 2) + '</div><div class="sub">价格</div></div>' +
      '<div class="metric"><div class="lab">最大回撤</div><div class="val loss">' + fmtPct(maxDd, 2) + '</div><div class="sub">区间</div></div>' +
      '<div class="metric"><div class="lab">年化涨跌</div><div class="val ' + pnlClass(annualized) + '">' + fmtPct(annualized, 1) + '</div><div class="sub">参考</div></div>' +
      '<div class="metric"><div class="lab">最新价</div><div class="val">' + fmtPrice(endPrice, inst.currency) + '</div><div class="sub">' + inst.currency + '</div></div>' +
    '</div>';
  } else {
    chartHTML = chartEmptyHTML(inst.market ? '正在获取历史行情…' : '还没有足够的价格历史', 174);
  }
  const ccyLabel = mode === 'profit' ? inst.currency + ' 累计收益' : inst.currency + ' 原币计价';
  const sourceLabel = inst.market ? '行情自动同步' : '按记录生成';
  return '<div class="detail-chart-card">' +
    '<div class="chart-head"><div><h2>' + (mode === 'profit' ? '累计收益' : '价格走势') + '</h2><div class="sub">' + (rangeText || '暂无数据') + ' · ' + ccyLabel + ' · ' + sourceLabel + '</div></div>' +
      '<div class="segmented small chart-toggle"><button class="seg ' + (mode === 'price' ? 'active' : '') + '" data-action="set-instrument-chart-mode" data-value="price">价格</button><button class="seg ' + (mode === 'profit' ? 'active' : '') + '" data-action="set-instrument-chart-mode" data-value="profit">累计收益</button></div></div>' +
    chartHTML + metricsHTML +
    '<div class="period-row"><div class="segmented small">' + [30, 90, 365, 0].map(d => '<button class="seg ' + (period === d ? 'active' : '') + '" data-action="set-instrument-period" data-value="' + d + '">' + labels[d] + '</button>').join('') + '</div>' +
      '<span class="tiny">' + (lastDate ? shortDate(lastDate) : '') + '</span></div>' +
  '</div>';
}
